<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 456" width="840" height="456" role="img" aria-labelledby="t d">
<title id="t">The spans a second one core holds over TLS, connect-zig against Collector, Vector, connect-go, connect-rust, as one gateway core for 33,000 servers</title>
<desc id="d">One core holds 5.8 times connect-go's and 2.2 times connect-rust's spans a second. connect-zig 607,418 spans a second at p99 99.25 ms, Collector 206,910 spans a second at p99 46.15 ms, Vector 73,968 spans a second at p99 9.43 ms, connect-go 105,198 spans a second at p99 83.52 ms, connect-rust 279,862 spans a second at p99 48.3 ms. p99 at each step: connect-zig: 9k 2.54 ms, 18k 2.34 ms, 27k 2.38 ms, 36k 2.34 ms, 53k 2.43 ms, 71k 2.49 ms, 107k 2.59 ms, 142k 2.82 ms, 214k 3.04 ms, 285k 3.15 ms, 356k 3.31 ms, 427k 3.48 ms, 570k 4.24 ms, 605k 22.7 ms, 623k 99.57 ms, 627k 103.99 ms p99, 632k 102.6 ms p99, 641k 128.39 ms p99, 712k 418.22 ms refused; Collector: 9k 3.88 ms, 18k 3.76 ms, 27k 3.7 ms, 36k 3.75 ms, 53k 3.8 ms, 71k 4.58 ms, 107k 9.91 ms, 142k 17.57 ms, 178k 34.82 ms, 196k 42.49 ms, 205k 43.54 ms, 207k 46.15 ms, 209k 218.39 ms p99, 214k 169.43 ms p99; Vector: 9k 6.42 ms, 18k 6.53 ms, 27k 6.78 ms, 36k 6.97 ms, 53k 7.55 ms, 71k 7.93 ms, 80k 17.59 ms, 85k 10.55 ms, 86k 2480.09 ms p99, 87k 3043.25 ms p99, 89k 2910.62 ms p99, 107k 5124.09 ms p99; connect-go: 9k 5.27 ms, 18k 5.38 ms, 27k 6.53 ms, 36k 7.93 ms, 53k 7.61 ms, 71k 10.44 ms, 107k 22.32 ms, 108k 73.95 ms, 109k 113.89 ms p99, 111k 892.11 ms p99, 116k 1176.14 ms p99, 125k 2940.05 ms p99, 142k 4851.11 ms p99; connect-rust: 9k 3.05 ms, 18k 3.1 ms, 27k 3.23 ms, 36k 3.14 ms, 53k 3.14 ms, 71k 3.19 ms, 107k 3.42 ms, 142k 3.64 ms, 214k 3.79 ms, 285k 20.06 ms, 287k 47.55 ms, 289k 1965.38 ms p99, 294k 739.03 ms p99, 303k 1409.56 ms p99, 320k 2655.7 ms p99, 356k 4202.74 ms p99.</desc>
<style>
