<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 646" width="840" height="646" role="img" aria-labelledby="t d">
<title id="t">What gzip, zstd and brotli leave of each Connect receiver's rate over TLS, as a share of the same receiver uncompressed</title>
<desc id="d">In gzip, zstd and brotli, connect-zig holds 111%, 113% and 88% of its uncompressed rate. connect-zig uncompressed: 693,288 spans a second held, 1,563 calls a second at peak; connect-zig gzip: 766,312 spans a second held, 111% of uncompressed, 1,884 calls a second at peak; connect-zig zstd: 784,542 spans a second held, 113% of uncompressed, 1,923 calls a second at peak; connect-zig brotli: 638,582 spans a second held, 88% of uncompressed, 1,698 calls a second at peak; connect-go uncompressed: 166,355 spans a second held, 461 calls a second at peak; connect-go gzip: 138,840 spans a second held, 77% of uncompressed, 413 calls a second at peak; connect-go zstd: 157,018 spans a second held, 94% of uncompressed, 435 calls a second at peak; connect-go brotli: 131,720 spans a second held, 79% of uncompressed, 402 calls a second at peak; connect-rust uncompressed: 445,414 spans a second held, 1,152 calls a second at peak; connect-rust gzip: 322,995 spans a second held, 73% of uncompressed, 919 calls a second at peak; connect-rust zstd: 424,982 spans a second held, 95% of uncompressed, 1,070 calls a second at peak; connect-rust brotli: 368,158 spans a second held, 83% of uncompressed, 932 calls a second at peak.</desc>
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e4e3df; --zig:#2a78d6; --go:#1a8a82; --rust:#b5562b; }
