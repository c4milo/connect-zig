// Every type the protobuf runtime reads and writes, which tools/coverage_check.sh compares with
// the Go implementation through buf convert: each scalar in each cardinality, every map key type,
// oneofs, enums, recursion and each well-known type.
syntax = "proto3";

package coverage.v1;

import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

enum Color {
  option allow_alias = true;
  COLOR_UNSPECIFIED = 0;
  COLOR_RED = 1;
  COLOR_CRIMSON = 1;
  COLOR_BLUE = 2;
  COLOR_NEGATIVE = -1;
}

message Nested {
  int32 a = 1;
  string b = 2;
}

message Scalars {
  double f_double = 1;
  float f_float = 2;
  int32 f_int32 = 3;
  int64 f_int64 = 4;
  uint32 f_uint32 = 5;
  uint64 f_uint64 = 6;
  sint32 f_sint32 = 7;
  sint64 f_sint64 = 8;
  fixed32 f_fixed32 = 9;
  fixed64 f_fixed64 = 10;
  sfixed32 f_sfixed32 = 11;
  sfixed64 f_sfixed64 = 12;
  bool f_bool = 13;
  string f_string = 14;
  bytes f_bytes = 15;
  Color f_color = 16;
}

message Optionals {
  optional double o_double = 1;
  optional float o_float = 2;
  optional int32 o_int32 = 3;
  optional int64 o_int64 = 4;
  optional uint32 o_uint32 = 5;
  optional uint64 o_uint64 = 6;
  optional sint32 o_sint32 = 7;
  optional sint64 o_sint64 = 8;
  optional fixed32 o_fixed32 = 9;
  optional fixed64 o_fixed64 = 10;
  optional sfixed32 o_sfixed32 = 11;
  optional sfixed64 o_sfixed64 = 12;
  optional bool o_bool = 13;
  optional string o_string = 14;
  optional bytes o_bytes = 15;
  optional Color o_color = 16;
}

message Repeateds {
  repeated double r_double = 1;
  repeated float r_float = 2;
  repeated int32 r_int32 = 3;
  repeated int64 r_int64 = 4;
  repeated uint32 r_uint32 = 5;
  repeated uint64 r_uint64 = 6;
  repeated sint32 r_sint32 = 7;
  repeated sint64 r_sint64 = 8;
  repeated fixed32 r_fixed32 = 9;
  repeated fixed64 r_fixed64 = 10;
  repeated sfixed32 r_sfixed32 = 11;
  repeated sfixed64 r_sfixed64 = 12;
  repeated bool r_bool = 13;
  repeated string r_string = 14;
  repeated bytes r_bytes = 15;
  repeated Color r_color = 16;
  repeated Nested r_nested = 17;
  repeated int32 u_int32 = 18 [packed = false];
  repeated sint64 u_sint64 = 19 [packed = false];
  repeated double u_double = 20 [packed = false];
  repeated bool u_bool = 21 [packed = false];
  repeated Color u_color = 22 [packed = false];
}

message Maps {
  map<int32, string> m_int32 = 1;
  map<int64, string> m_int64 = 2;
  map<uint32, string> m_uint32 = 3;
  map<uint64, string> m_uint64 = 4;
  map<sint32, string> m_sint32 = 5;
  map<sint64, string> m_sint64 = 6;
  map<fixed32, string> m_fixed32 = 7;
  map<fixed64, string> m_fixed64 = 8;
  map<sfixed32, string> m_sfixed32 = 9;
  map<sfixed64, string> m_sfixed64 = 10;
  map<bool, string> m_bool = 11;
  map<string, string> m_string = 12;
  map<string, Nested> m_nested = 13;
  map<string, Color> m_color = 14;
  map<string, bytes> m_bytes = 15;
  map<string, double> m_double = 16;
  map<int32, int64> m_int32_int64 = 17;
}

message Choice {
  oneof kind {
    int32 c_int32 = 1;
    string c_string = 2;
    bytes c_bytes = 3;
    Nested c_nested = 4;
    Color c_color = 5;
    double c_double = 6;
    bool c_bool = 7;
  }
}

message WellKnown {
  google.protobuf.Timestamp timestamp = 1;
  google.protobuf.Duration duration = 2;
  google.protobuf.FieldMask field_mask = 3;
  google.protobuf.Empty empty = 4;
  google.protobuf.Struct struct_value = 5;
  google.protobuf.Value value = 6;
  google.protobuf.ListValue list_value = 7;
  google.protobuf.Any any = 8;
  google.protobuf.NullValue null_value = 9;
  google.protobuf.DoubleValue double_value = 10;
  google.protobuf.FloatValue float_value = 11;
  google.protobuf.Int64Value int64_value = 12;
  google.protobuf.UInt64Value uint64_value = 13;
  google.protobuf.Int32Value int32_value = 14;
  google.protobuf.UInt32Value uint32_value = 15;
  google.protobuf.BoolValue bool_value = 16;
  google.protobuf.StringValue string_value = 17;
  google.protobuf.BytesValue bytes_value = 18;
  repeated google.protobuf.Timestamp timestamps = 19;
  repeated google.protobuf.Value values = 20;
  repeated google.protobuf.Any anys = 21;
  map<string, google.protobuf.Value> value_map = 22;
}

// Every shape at once, and a recursive field.
message Everything {
  Scalars scalars = 1;
  Optionals optionals = 2;
  Repeateds repeateds = 3;
  Maps maps = 4;
  Choice choice = 5;
  WellKnown well_known = 6;
  Everything child = 7;
  repeated Everything children = 8;
}

// An older schema of Everything, which knows only its scalars. Read with it, every other field of
// Everything is unknown and must be written back as it came (decision 24).
message Partial {
  Scalars scalars = 1;
}
