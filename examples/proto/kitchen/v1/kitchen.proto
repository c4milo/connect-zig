// Every shape the generator writes, which CI generates and compiles: each scalar kind, presence,
// oneofs, maps, nesting, recursion, enums with aliases, well-known types, an import of another
// file, and each stream type.
syntax = "proto3";

package kitchen.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "kitchen/v1/shared.proto";

enum Mood {
  option allow_alias = true;
  MOOD_UNSPECIFIED = 0;
  MOOD_HAPPY = 1;
  MOOD_GLAD = 1;
  MOOD_SAD = 2;
}

message Scalars {
  double a_double = 1;
  float a_float = 2;
  int64 a_int64 = 3;
  uint64 a_uint64 = 4;
  int32 a_int32 = 5;
  fixed64 a_fixed64 = 6;
  fixed32 a_fixed32 = 7;
  bool a_bool = 8;
  string a_string = 9;
  bytes a_bytes = 10;
  uint32 a_uint32 = 11;
  sfixed32 a_sfixed32 = 12;
  sfixed64 a_sfixed64 = 13;
  sint32 a_sint32 = 14;
  sint64 a_sint64 = 15;
  optional int32 maybe = 16;
  repeated int32 packed_numbers = 17;
  repeated int32 unpacked_numbers = 18 [packed = false];
  Mood mood = 19;
}

message Tree {
  string name = 1;
  Tree parent = 2;
  repeated Tree children = 3;
  map<string, Tree> named = 4;
  map<int32, string> labels = 5;
  oneof payload {
    string text = 6;
    Scalars scalars = 7;
    Tree twin = 8;
  }
  message Leaf {
    enum Kind {
      KIND_UNSPECIFIED = 0;
      KIND_GREEN = 1;
    }
    Kind kind = 1;
    shared.v1.Tag tag = 2;
  }
  repeated Leaf leaves = 9;
  google.protobuf.Timestamp created = 10;
  google.protobuf.Duration age = 11;
  google.protobuf.FieldMask mask = 12;
  google.protobuf.StringValue nickname = 13;
  string type = 14;
}

service KitchenService {
  rpc Get(Tree) returns (Tree) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc Put(Tree) returns (Tree) {
    option idempotency_level = IDEMPOTENT;
  }
  rpc Upload(stream Scalars) returns (Tree) {}
  rpc Watch(Tree) returns (stream Tree) {}
  rpc Chat(stream Tree) returns (stream Tree) {}
}
