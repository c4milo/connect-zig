// proto2, which tools/coverage_check.sh compares with Go: groups, presence on every singular
// field, unpacked repeated scalars, the packed option, closed enums and strings no parser checks.
syntax = "proto2";

package legacy.v1;

// A proto2 enum is closed: a number it does not name goes to the unknown fields.
enum Size {
  SIZE_UNSPECIFIED = 0;
  SMALL = 1;
  LARGE = 2;
}

message Everything {
  optional int32 count = 1;
  optional string label = 2;
  required int64 id = 3;
  repeated int32 unpacked = 4;
  repeated int32 packed = 5 [packed = true];
  optional group Inner = 6 {
    optional int32 a = 7;
    optional string b = 8;
  }
  repeated group Item = 9 {
    optional int32 x = 10;
  }
  optional Everything child = 11;
  map<string, int32> counts = 12;
  optional Size size = 13;
  repeated Size sizes = 14;
  repeated Size packed_sizes = 15 [packed = true];
  map<string, Size> sizes_by_name = 16;
  oneof pick {
    Size picked_size = 17;
    string picked_label = 18;
  }
  repeated string labels = 19;
}
