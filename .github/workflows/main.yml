# Every check of this repository, on each push to main and each pull request (docs/decisions.md
# entry 16), and the benchmarks on each tag (decision 44 as amended on 2026-11-25). `plan` asks
# tools/ci.sh for the event's jobs, and `check` runs each in a job of its own, so each shows apart
# in GitHub's checks with its own summary: a new check joins tools/ci.sh alone. Each job's work is
# `tools/ci.sh --only <check>`, which a person runs by hand for the same answer. Each download is
# pinned by checksum. On a tag, `charts` attaches the charts the benchmarks drew to its release.
name: main
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      benchmarks:
        description: Run the benchmarks in place of the other checks, and keep their charts
        type: boolean
        default: false
permissions:
  contents: read
env:
  ZIG_VERSION: 0.16.0
  ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
  ZIG_SHA256_ARM64: ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17
  # buf runs the plugin over examples/proto and tools/proto, and tools/generate_check.sh compares
  # its output with examples/gen and tools/gen (design §8 step 6).
  BUF_VERSION: 1.74.0
  BUF_SHA256: 92326d957d613712669fb55f9e4340946a8142a92120e09008459118778273d2
  BUF_SHA256_ARM64: d42b471501a85dbadb40062960492dd81ce5ca4e413f4133d514d3ae3c0af4df
  # go.mod files name their Go; the runner's Go fetches it.
  GOTOOLCHAIN: auto
jobs:
  plan:
    runs-on: ubuntu-26.04
    outputs:
      jobs: ${{ steps.list.outputs.jobs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: list
        env:
          EVENT: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.benchmarks) && 'tag' || 'push' }}
        run: echo "jobs=$(tools/ci.sh --matrix "${EVENT}")" >>"${GITHUB_OUTPUT}"
  check:
    needs: plan
    name: ${{ matrix.check }}${{ matrix.runner == 'ubuntu-26.04-arm' && ' (arm64)' || '' }}
    runs-on: ${{ matrix.runner }}
    # A full-stack check climbs one server after another: the compression checks run 12 climbs,
    # about 45 minutes, and the margin keeps a slow runner from ending one.
    timeout-minutes: ${{ startsWith(matrix.check, 'fullstack') && 90 || 60 }}
    strategy:
      fail-fast: false
      # tools/ci.sh names each job's check and runner, the arm64 ones included.
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.jobs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit linter reads the pushed range, which needs the history.
          fetch-depth: 0
      - name: Restore Zig and buf
        id: zig
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/zig
            ~/bin
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ env.ZIG_SHA256 }}-${{ env.ZIG_SHA256_ARM64 }}-${{ env.BUF_SHA256 }}-${{ env.BUF_SHA256_ARM64 }}
      - name: Install Zig
        if: steps.zig.outputs.cache-hit != 'true'
        run: |
          case "$(uname -m)" in
            aarch64) arch=aarch64 sha="${ZIG_SHA256_ARM64}" ;;
            *) arch=x86_64 sha="${ZIG_SHA256}" ;;
          esac
          curl -sSfL -o zig.tar.xz "https://ziglang.org/download/${ZIG_VERSION}/zig-${arch}-linux-${ZIG_VERSION}.tar.xz"
          echo "${sha}  zig.tar.xz" | sha256sum -c -
          mkdir -p "${HOME}/zig" && tar -xJf zig.tar.xz -C "${HOME}/zig" --strip-components=1
          rm zig.tar.xz
      - name: Install buf
        if: steps.zig.outputs.cache-hit != 'true'
        run: |
          case "$(uname -m)" in
            aarch64) arch=aarch64 sha="${BUF_SHA256_ARM64}" ;;
            *) arch=x86_64 sha="${BUF_SHA256}" ;;
          esac
          curl -sSfL -o buf "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-${arch}"
          echo "${sha}  buf" | sha256sum -c -
          mkdir -p "${HOME}/bin" && install -m 0755 buf "${HOME}/bin/buf"
          rm buf
      - name: Install valgrind
        if: matrix.check == 'perf'
        run: sudo apt-get update -q && sudo apt-get install -y -q valgrind
      # bench-validate --counters counts its own cycles and branch misses through perf_event_open,
      # which the kernel allows a process only below this level.
      - name: Let a process count its own events
        if: matrix.check == 'validate-compare'
        run: sudo sysctl -w kernel.perf_event_paranoid=1
      # The full-stack check's load generator, as colibri's judge installs it (decision 44).
      - name: Install h2load
        if: startsWith(matrix.check, 'fullstack')
        run: sudo apt-get update -q && sudo apt-get install -y -q nghttp2-client
      - name: Put the tools on the path
        run: |
          echo "${HOME}/zig" >>"${GITHUB_PATH}"
          echo "${HOME}/bin" >>"${GITHUB_PATH}"
      # Zig's caches are addressed by content. Each commit saves its own entry and a run restores
      # the newest one.
      - name: Restore the Zig caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: zig-cache-${{ matrix.check }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig.zon') }}-${{ github.sha }}
          restore-keys: |
            zig-cache-${{ matrix.check }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig.zon') }}-
      # What each check installs for itself, pinned by its lock files: Go modules, npm packages,
      # the Python virtual environments, Cargo's builds and the conformance runner.
      - name: Restore the checks' caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/connect-zig
            ~/go/pkg/mod
            ~/.cargo/registry
            interop/typescript/node_modules
          key: deps-${{ matrix.check }}-${{ runner.arch }}-${{ hashFiles('interop/*/go.sum', 'interop/*/package-lock.json', 'interop/*/Cargo.lock', 'interop/*/requirements.txt', 'tools/*.txt', 'bench/go/go.sum', 'bench/rust/Cargo.lock', 'tools/fullstack/*/go.sum', 'tools/fullstack/*/Cargo.lock') }}
          restore-keys: |
            deps-${{ matrix.check }}-${{ runner.arch }}-
      # On a tag, the previous tag's files of values, so that each chart marks what changed since
      # it (tools/chart_change.py).
      - name: Take the previous tag's values
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tools/charts_previous.sh "${GITHUB_REF_NAME}" charts-previous
          echo "CHARTS_PREVIOUS=${PWD}/charts-previous" >>"${GITHUB_ENV}"
      - name: Run the check
        env:
          COMMIT_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || (github.event.before && github.event.before != '0000000000000000000000000000000000000000' && format('{0}..{1}', github.event.before, github.sha)) || format('{0}~1..{0}', github.sha) }}
        run: tools/ci.sh --only "${{ matrix.check }}" ci-report.md
      - name: Publish the report
        if: always()
        run: '[ -f ci-report.md ] && cat ci-report.md >>"${GITHUB_STEP_SUMMARY}" || true'
      # The charts that a benchmark drew from its own output, with that output (tools/ci.sh,
      # draw_charts). On a tag, `charts` attaches them to its release (decision 44 as amended).
      - name: Keep the charts
        if: always() && hashFiles('ci-charts/*.svg') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: charts-${{ matrix.check }}-${{ runner.arch }}
          path: ci-charts/
          retention-days: 90
  # A tag's charts, once every benchmark of the tag passed: each is attached to the tag's GitHub
  # release with its file of values, and written to the branch `charts`, which the README and
  # docs/benchmarks.md show them from. What changed since the previous tag goes to the release's
  # notes and this job's summary (tools/charts_release.sh).
  charts:
    needs: check
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # tools/charts_previous.sh finds the previous tag in the history.
          fetch-depth: 0
      - name: Take the run's charts
        run: gh run download "${GITHUB_RUN_ID}" --pattern 'charts-*' --dir ci-charts
      - name: Attach them to the release
        run: tools/charts_release.sh ci-charts "${GITHUB_REF_NAME}"
