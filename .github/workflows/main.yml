# Every check of this repository, on each push to main and each pull request: tools/ci.sh on
# Linux x86-64 (docs/decisions.md entry 14). Each job's work
# is one script or one zig build step, which a person runs by hand for the same answer. Each
# download is pinned by checksum.
name: main
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  ZIG_VERSION: 0.16.0
  ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Restore Zig
        id: zig
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/zig
          key: zig-${{ runner.os }}-${{ env.ZIG_SHA256 }}
      - name: Install Zig
        if: steps.zig.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o zig.tar.xz "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          echo "${ZIG_SHA256}  zig.tar.xz" | sha256sum -c -
          mkdir -p "${HOME}/zig" && tar -xJf zig.tar.xz -C "${HOME}/zig" --strip-components=1
          rm zig.tar.xz
      - name: Put Zig on the path
        run: echo "${HOME}/zig" >>"${GITHUB_PATH}"
      # Zig's caches are addressed by content. Each commit saves its own entry and a run restores
      # the newest one.
      - name: Restore the Zig caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: zig-cache-${{ runner.os }}-${{ hashFiles('build.zig.zon') }}-${{ github.sha }}
          restore-keys: |
            zig-cache-${{ runner.os }}-${{ hashFiles('build.zig.zon') }}-
      - name: Run every check
        run: tools/ci.sh ci-report.md
      - name: Publish the report
        if: always()
        run: cat ci-report.md >>"${GITHUB_STEP_SUMMARY}"
