# Every check of this repository, on each push to main and each pull request: tools/ci.sh on
# Linux x86-64 (docs/decisions.md entry 16). Each job's work
# is one script or one zig build step, which a person runs by hand for the same answer. Each
# download is pinned by checksum.
name: main
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  ZIG_VERSION: 0.16.0
  ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
  # buf runs the plugin over examples/proto, and tools/generate_check.sh compares its output with
  # examples/gen (design §8 step 6).
  BUF_VERSION: 1.74.0
  BUF_SHA256: 92326d957d613712669fb55f9e4340946a8142a92120e09008459118778273d2
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Restore Zig and buf
        id: zig
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/zig
            ~/bin
          key: tools-${{ runner.os }}-${{ env.ZIG_SHA256 }}-${{ env.BUF_SHA256 }}
      - name: Install Zig
        if: steps.zig.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o zig.tar.xz "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          echo "${ZIG_SHA256}  zig.tar.xz" | sha256sum -c -
          mkdir -p "${HOME}/zig" && tar -xJf zig.tar.xz -C "${HOME}/zig" --strip-components=1
          rm zig.tar.xz
      - name: Install buf
        if: steps.zig.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o buf "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64"
          echo "${BUF_SHA256}  buf" | sha256sum -c -
          mkdir -p "${HOME}/bin" && install -m 0755 buf "${HOME}/bin/buf"
          rm buf
      - name: Put the tools on the path
        run: |
          echo "${HOME}/zig" >>"${GITHUB_PATH}"
          echo "${HOME}/bin" >>"${GITHUB_PATH}"
      # Zig's caches are addressed by content. Each commit saves its own entry and a run restores
      # the newest one.
      - name: Restore the Zig caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: zig-cache-${{ runner.os }}-${{ hashFiles('build.zig.zon') }}-${{ github.sha }}
          restore-keys: |
            zig-cache-${{ runner.os }}-${{ hashFiles('build.zig.zon') }}-
      - name: Run every check
        run: tools/ci.sh ci-report.md
      - name: Publish the report
        if: always()
        run: cat ci-report.md >>"${GITHUB_STEP_SUMMARY}"
