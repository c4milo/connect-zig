name: Bug
description: connect-zig does something the protocol, the protobuf spec or its documents say it must not do.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report a vulnerability here. SECURITY.md says where to send it.
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit of connect-zig, and the output of `zig version`.
      placeholder: d9178fe, zig 0.16.0
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options: [protobuf binary, proto3 JSON, Connect, gRPC, gRPC-Web, generated code, other]
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: The calls your program made, the octets connect-zig read, and what it returned.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: Cite the spec and the section that states the rule, when there is one.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: A .proto file, a test, an example program or a buf curl command.
      render: zig
