<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 294" width="840" height="294" role="img" aria-labelledby="t d">
<title id="t">A routed unary call through connect-zig and connect-rust, against connect-go</title>
<desc id="d">connect-zig is 10.0 to 12.6 times as fast as connect-go, 3.3 to 5.4 times connect-rust. Each bar is an implementation's speed in multiples of connect-go v1.21.1's, which is connect-go's time a call over the implementation's, for a small and a medium message in Connect and gRPC. connect-zig: Connect: Small, 40 B 10.0x, Medium, 1 KB 12.3x; gRPC: Small, 40 B 11.2x, Medium, 1 KB 12.6x. connect-rust 0.9.1: Connect: Small, 40 B 2.0x, Medium, 1 KB 3.7x; gRPC: Small, 40 B 2.1x, Medium, 1 KB 3.7x.</desc>
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e4e3df; --zig:#2a78d6; --rust:#eb6834; --unit:#52514e; }
@media (prefers-color-scheme: dark) {
  svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#8f8e86; --grid:#33332f; --zig:#3987e5; --rust:#d95926; --unit:#c3c2b7; }
}
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
.title { font-size: 17px; font-weight: 600; }
.sub { font-size: 12.5px; fill: var(--ink2); }
.panel { font-size: 14px; font-weight: 600; }
.row { font-size: 12.5px; fill: var(--ink2); }
.val { font-size: 11px; font-weight: 600; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.tick { font-size: 11px; fill: var(--muted); }
.note { font-size: 11.5px; fill: var(--ink2); }
.legend { font-size: 12.5px; fill: var(--ink2); }
.better { fill: #1a7f37; } .worse { fill: #cf222e; }
@media (prefers-color-scheme: dark) { .better { fill: #3fb950; } .worse { fill: #f85149; } }
.was { stroke: var(--ink2); stroke-width: 1.5; stroke-dasharray: 2 2; }
</style>
<rect width="840" height="294" rx="8" fill="var(--surface)"/>
<text class="title" x="24" y="34">connect-zig is 10.0 to 12.6 times as fast as connect-go, 3.3 to 5.4 times connect-rust</text>
<text class="sub" x="24" y="56">One unary call in memory: router, route, protocol and codec, with no socket, no TLS and no HTTP/2 framing.</text>
<text class="sub" x="24" y="74">Each bar is a speed in multiples of connect-go's: its time over the bar's time. A longer bar is faster.</text>
<text class="sub" x="24" y="92">One CI job ran all three, and each answered the same octets: run 313, commit c6cce91, aarch64, Neoverse-N2.</text>
<rect x="24" y="100" width="12" height="12" rx="2" fill="var(--zig)"/>
<text class="legend" x="42" y="110">connect-zig</text>
<rect x="143" y="100" width="12" height="12" rx="2" fill="var(--rust)"/>
<text class="legend" x="161" y="110">connect-rust 0.9.1</text>
<line x1="311" y1="106" x2="327" y2="106" stroke="var(--unit)" stroke-width="1.5" stroke-dasharray="4 3"/>
<text class="legend" x="333" y="110">connect-go v1.21.1: the unit</text>
<text class="panel" x="24" y="148">Connect</text>
<line x1="136.0" y1="160" x2="136.0" y2="234" stroke="var(--grid)" stroke-width="1"/>
<text class="tick" x="136.0" y="248" text-anchor="middle">0×</text>
<line x1="205.2" y1="160" x2="205.2" y2="234" stroke="var(--grid)" stroke-width="1"/>
<text class="tick" x="205.2" y="248" text-anchor="middle">5×</text>
<line x1="274.5" y1="160" x2="274.5" y2="234" stroke="var(--grid)" stroke-width="1"/>
<text class="tick" x="274.5" y="248" text-anchor="middle">10×</text>
<text class="row" x="126" y="182.0" text-anchor="end">Small, 40 B</text>
<path d="M136.0,164 h134.2 a4.0,4.0 0 0 1 4.0,4.0 v5.0 a4.0,4.0 0 0 1 -4.0,4.0 h-134.2 z" fill="var(--zig)"/>
<line class="was" x1="266.8" y1="162.0" x2="266.8" y2="179.0"/>
<text class="val" x="279.2" y="174">10.0×, 0.35 µs <tspan class="better">▲6%</tspan></text>
<path d="M136.0,179 h23.2 a4.0,4.0 0 0 1 4.0,4.0 v5.0 a4.0,4.0 0 0 1 -4.0,4.0 h-23.2 z" fill="var(--rust)"/>
<text class="val" x="168.2" y="189">2.0×</text>
<text class="row" x="126" y="220.0" text-anchor="end">Medium, 1 KB</text>
<path d="M136.0,202 h166.4 a4.0,4.0 0 0 1 4.0,4.0 v5.0 a4.0,4.0 0 0 1 -4.0,4.0 h-166.4 z" fill="var(--zig)"/>
<line class="was" x1="304.4" y1="200.0" x2="304.4" y2="217.0"/>
<text class="val" x="311.4" y="212">12.3×, 1.77 µs</text>
<path d="M136.0,217 h47.6 a4.0,4.0 0 0 1 4.0,4.0 v5.0 a4.0,4.0 0 0 1 -4.0,4.0 h-47.6 z" fill="var(--rust)"/>
<text class="val" x="192.6" y="227">3.7×</text>
<line x1="149.8" y1="156" x2="149.8" y2="234" stroke="var(--unit)" stroke-width="1.5" stroke-dasharray="4 3"/>
<text class="note" x="153.8" y="154">1× = as fast as connect-go</text>
<text class="panel" x="432" y="148">gRPC</text>
<line x1="544.0" y1="160" x2="544.0" y2="234" stroke="var(--grid)" stroke-width="1"/>
<text class="tick" x="544.0" y="248" text-anchor="middle">0×</text>
<line x1="613.2" y1="160" x2="613.2" y2="234" stroke="var(--grid)" stroke-width="1"/>
<text class="tick" x="613.2" y="248" text-anchor="middle">5×</text>
<line x1="682.5" y1="160" x2="682.5" y2="234" stroke="var(--grid)" stroke-width="1"/>
<text class="tick" x="682.5" y="248" text-anchor="middle">10×</text>
<text class="row" x="534" y="182.0" text-anchor="end">Small, 40 B</text>
<path d="M544.0,164 h150.7 a4.0,4.0 0 0 1 4.0,4.0 v5.0 a4.0,4.0 0 0 1 -4.0,4.0 h-150.7 z" fill="var(--zig)"/>
<line class="was" x1="692.0" y1="162.0" x2="692.0" y2="179.0"/>
<text class="val" x="703.7" y="174">11.2×, 0.37 µs</text>
<path d="M544.0,179 h24.5 a4.0,4.0 0 0 1 4.0,4.0 v5.0 a4.0,4.0 0 0 1 -4.0,4.0 h-24.5 z" fill="var(--rust)"/>
<text class="val" x="577.5" y="189">2.1×</text>
<text class="row" x="534" y="220.0" text-anchor="end">Medium, 1 KB</text>
<path d="M544.0,202 h169.9 a4.0,4.0 0 0 1 4.0,4.0 v5.0 a4.0,4.0 0 0 1 -4.0,4.0 h-169.9 z" fill="var(--zig)"/>
<line class="was" x1="713.3" y1="200.0" x2="713.3" y2="217.0"/>
<text class="val" x="722.9" y="212">12.6×, 1.79 µs</text>
<path d="M544.0,217 h46.8 a4.0,4.0 0 0 1 4.0,4.0 v5.0 a4.0,4.0 0 0 1 -4.0,4.0 h-46.8 z" fill="var(--rust)"/>
<text class="val" x="599.8" y="227">3.7×</text>
<line x1="557.8" y1="156" x2="557.8" y2="234" stroke="var(--unit)" stroke-width="1.5" stroke-dasharray="4 3"/>
<text class="sub" x="24" y="282">▲ marks a value 5% or more better than v0.6.0's, ▼ one that much worse, and a dashed line v0.6.0's value.</text>
</svg>
