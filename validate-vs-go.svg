<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 656" width="840" height="656" role="img" aria-labelledby="t d">
<title id="t">A decode and a validation of one message by five protovalidate implementations, against protovalidate-go</title>
<desc id="d">connect-zig decodes and validates 13 to 58 times as fast as protovalidate-go. Each bar is an implementation's speed in multiples of protovalidate-go v1.4.1's, which is protovalidate-go's time over the implementation's, on a logarithmic axis. small valid: connect-zig 16×, protovalidate-buffa 0.8.0 6.4×, prost-protovalidate 0.6.1 0.99×, protovalidate-es 1.3.0 0.63×; small invalid: connect-zig 36×, protovalidate-buffa 0.8.0 17×, prost-protovalidate 0.6.1 0.93×, protovalidate-es 1.3.0 0.51×; medium valid: connect-zig 13×, protovalidate-buffa 0.8.0 7.6×, prost-protovalidate 0.6.1 0.22×, protovalidate-es 1.3.0 0.19×; medium invalid: connect-zig 29×, protovalidate-buffa 0.8.0 11×, prost-protovalidate 0.6.1 0.32×, protovalidate-es 1.3.0 0.35×; rules valid: connect-zig 52×, protovalidate-buffa 0.8.0 29×, prost-protovalidate 0.6.1 0.43×, protovalidate-es 1.3.0 0.40×; rules invalid: connect-zig 58×, protovalidate-buffa 0.8.0 27×, prost-protovalidate 0.6.1 0.51×, protovalidate-es 1.3.0 0.42×.</desc>
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e4e3df; --zig:#2a78d6; --buffa:#eb6834; --prost:#c79a2c; --es:#3a9b6c; --unit:#52514e; }
@media (prefers-color-scheme: dark) {
  svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#8f8e86; --grid:#33332f; --zig:#3987e5; --buffa:#d95926; --prost:#d6aa3e; --es:#4caf7d; --unit:#c3c2b7; }
}
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
.title { font-size: 17px; font-weight: 600; }
.sub { font-size: 12.5px; fill: var(--ink2); }
.row { font-size: 12.5px; fill: var(--ink2); }
.val { font-size: 11px; font-weight: 600; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.tick { font-size: 11px; fill: var(--muted); }
.note { font-size: 11.5px; fill: var(--ink2); }
.legend { font-size: 12.5px; fill: var(--ink2); }
.better { fill: #1a7f37; } .worse { fill: #cf222e; }
@media (prefers-color-scheme: dark) { .better { fill: #3fb950; } .worse { fill: #f85149; } }
.was { stroke: var(--ink2); stroke-width: 1.5; stroke-dasharray: 2 2; }
</style>
<rect width="840" height="656" rx="8" fill="var(--surface)"/>
<text class="title" x="24" y="34">connect-zig decodes and validates 13 to 58 times as fast as protovalidate-go</text>
<text class="sub" x="24" y="56">One decode of a request message and one validation of it against the rules of its schema, in memory.</text>
<text class="sub" x="24" y="74">Each bar is a speed in multiples of protovalidate-go v1.4.1's: its time over the bar's time, on a logarithmic axis.</text>
<text class="sub" x="24" y="92">connect-zig is the fastest in 6 of 6 cases. Each implementation gave each message the same verdict.</text>
<text class="sub" x="24" y="110">One CI job ran all five: run 313, commit c6cce91, AMD EPYC 9V74 80-Core Processor, x86_64.</text>
