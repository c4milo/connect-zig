# The cases of protovalidate's conformance suite v1.2.2 that connect-zig fails on purpose, each
# under its reason (decision 47). `tools/protovalidate_conformance_check.sh` passes this file to
# the harness as its expected failures: a suite's name, then its cases. The harness fails when
# a case here passes, so the step that makes one pass removes its line.

