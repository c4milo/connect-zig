<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 646" width="840" height="646" role="img" aria-labelledby="t d">
<title id="t">What gzip, zstd and brotli leave of each Connect receiver's rate over TLS, as a share of the same receiver uncompressed</title>
<desc id="d">In gzip, zstd and brotli, connect-zig holds 107%, 110% and 90% of its uncompressed rate. connect-zig uncompressed: 676,830 spans a second held, 1,462 calls a second at peak; connect-zig gzip: 727,614 spans a second held, 107% of uncompressed, 1,736 calls a second at peak; connect-zig zstd: 744,555 spans a second held, 110% of uncompressed, 1,748 calls a second at peak; connect-zig brotli: 607,418 spans a second held, 90% of uncompressed, 1,530 calls a second at peak; connect-go uncompressed: 135,710 spans a second held, 366 calls a second at peak; connect-go gzip: 105,198 spans a second held, 78% of uncompressed, 333 calls a second at peak; connect-go zstd: 115,725 spans a second held, 85% of uncompressed, 343 calls a second at peak; connect-go brotli: 107,866 spans a second held, 79% of uncompressed, 331 calls a second at peak; connect-rust uncompressed: 303,306 spans a second held, 1,021 calls a second at peak; connect-rust gzip: 274,104 spans a second held, 93% of uncompressed, 992 calls a second at peak; connect-rust zstd: 288,515 spans a second held, 98% of uncompressed, 928 calls a second at peak; connect-rust brotli: 259,654 spans a second held, 88% of uncompressed, 923 calls a second at peak.</desc>
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e4e3df; --zig:#2a78d6; --go:#1a8a82; --rust:#b5562b; }
@media (prefers-color-scheme: dark) {
