<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 582" width="840" height="582" role="img" aria-labelledby="t d">
<title id="t">connect-zig and Buffa, connect-rust's codec, against Go's protobuf runtime, connect-go's codec</title>
<desc id="d">connect-zig is 3.2 to 20.9 times faster than Go and 1.1 to 2.2 times faster than Buffa. Each bar is a runtime's speed in multiples of Go's, which is the time of Go's google.golang.org/protobuf v1.36.12, connect-go's codec, over the runtime's time, for four messages and four operations. connect-zig: Small, 40 B: Binary encode 10.3x, Binary decode, every field read 7.4x, JSON encode 10.3x, JSON decode, every field read 12.1x; Medium, 1 KB: Binary encode 11.8x, Binary decode, every field read 10.7x, JSON encode 10.7x, JSON decode, every field read 15.0x; Large, 180 KB: Binary encode 3.2x, Binary decode, every field read 5.4x, JSON encode 7.9x, JSON decode, every field read 11.9x; Deep, 50 levels: Binary encode 3.4x, Binary decode, every field read 6.6x, JSON encode 20.9x, JSON decode, every field read 12.7x. Buffa 0.9.2, connect-rust's codec: Small, 40 B: Binary encode 6.5x, Binary decode, every field read 4.9x, JSON encode 9.8x, JSON decode, every field read 11.0x; Medium, 1 KB: Binary encode 9.6x, Binary decode, every field read 6.4x, JSON encode 8.3x, JSON decode, every field read 9.9x; Large, 180 KB: Binary encode 2.3x, Binary decode, every field read 3.3x, JSON encode 6.0x, JSON decode, every field read 10.0x; Deep, 50 levels: Binary encode 2.7x, Binary decode, every field read 3.0x, JSON encode 18.9x, JSON decode, every field read 8.0x.</desc>
<style>
