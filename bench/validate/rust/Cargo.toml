[package]
name = "validate-rust"
version = "0.1.0"
edition = "2024"
publish = false

# The validation benchmark's Rust program (tools/validate_compare_check.sh): protovalidate-buffa,
# whose plugin writes each message's validator as Rust code, over Buffa's messages, the codec of
# connect-rust.
[dependencies]
buffa = "0.9.2"
# The well-known types, which the schema's Duration and the validators name.
buffa-types = "0.9.2"
protovalidate-buffa = { version = "0.8.0", default-features = false }
# prost-protovalidate, which reads each message's rules through prost-reflect and runs its CEL in
# an interpreter, over prost's messages.
prost = "0.14"
prost-reflect = { version = "0.16", features = ["derive"] }
prost-types = "0.14"
prost-protovalidate = "0.6.1"

[build-dependencies]
buffa = "0.9.2"
buffa-build = "0.9.2"
buffa-codegen = "0.9.2"
protoc-gen-protovalidate-buffa = "0.11.0"
prost = "0.14"
prost-build = "0.14"
prost-types = "0.14"

# The benchmark's build: ReleaseFast's counterpart, one codegen unit and link-time optimization,
# as bench/rust builds.
[profile.release]
codegen-units = 1
lto = "fat"
