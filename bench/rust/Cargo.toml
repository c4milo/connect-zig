[package]
name = "bench-rust"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
buffa = { version = "0.9.2", features = ["json"] }
# The routed calls of src/call.rs: connect-rust on Buffa, called in memory as a tower service.
bytes = "1.12.1"
connectrpc = { version = "0.9.1", default-features = false, features = ["json"] }
http = "1.5.0"
http-body-util = "0.1.5"
tokio = { version = "1.54.1", features = ["rt"] }
tower = "0.5.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[build-dependencies]
buffa-build = "0.9.2"

# The benchmark's build: ReleaseFast's counterpart, one codegen unit and link-time optimization.
[profile.release]
codegen-units = 1
lto = "fat"
