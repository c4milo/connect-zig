[package]
name = "bench-rust"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
buffa = { version = "0.9.2", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[build-dependencies]
buffa-build = "0.9.2"

# The benchmark's build: ReleaseFast's counterpart, one codegen unit and link-time optimization.
[profile.release]
codegen-units = 1
lto = "fat"
