// The messages the benchmarks encode and decode, in Zig and in Go, from the same fixed values.
// Each stands for a shape a service sends: a small request, a record of about 1 KB, a large batch
// with bytes, and a message that nests its own type.
syntax = "proto3";

package bench.v1;

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_ACTIVE = 1;
  STATUS_SUSPENDED = 2;
  STATUS_CLOSED = 3;
}

// A typical RPC request: a few scalars and a short string.
message Small {
  int32 id = 1;
  int64 created = 2;
  bool active = 3;
  string name = 4;
  double score = 5;
}

message Address {
  string street = 1;
  string city = 2;
  string country = 3;
  uint32 postal_code = 4;
}

// About 1 KB: nested messages, packed integers, strings, a map, an enum and a oneof.
message Medium {
  uint64 id = 1;
  string name = 2;
  Status status = 3;
  Address home = 4;
  repeated int64 samples = 5;
  repeated string tags = 6;
  map<string, int64> counters = 7;
  repeated Address previous = 8;
  fixed64 checksum = 9;
  float ratio = 10;
  sint32 delta = 11;
  // The oneof takes the highest numbers. This library writes fields in number order ("Field
  // Order", encoding guide); Go writes a oneof's member after every other field. With the oneof
  // last, the two write the same bytes.
  oneof contact {
    string email = 12;
    string phone = 13;
    Address office = 14;
  }
}

// One element of `Large`: scalars, packed signed integers and a bytes payload.
message Record {
  uint64 id = 1;
  string key = 2;
  bytes payload = 3;
  repeated sint32 values = 4;
  double weight = 5;
  Status status = 6;
}

// A batch of records, a few hundred kilobytes in all, and a description of about 6 KB of text
// in several scripts, which a parser checks as UTF-8 at its vector path.
message Large {
  string name = 1;
  repeated Record records = 2;
  string description = 3;
}

// A message that holds its own type, nested as deep as the benchmark builds it.
message Deep {
  int32 level = 1;
  string label = 2;
  Deep child = 3;
}

// The four messages below each hold one kind of field alone, so the counts of one give the cost
// of that kind per field (pepegrillo's performance method, step 2).

// Varints alone: every varint kind, at each length from 1 to 10 bytes. Field 16's tag takes 2.
message Varints {
  int32 int32_one = 1;
  int32 int32_two = 2;
  int32 int32_negative = 3;
  int64 int64_three = 4;
  int64 int64_eight = 5;
  uint32 uint32_four = 6;
  uint32 uint32_five = 7;
  uint64 uint64_six = 8;
  uint64 uint64_ten = 9;
  sint32 sint32_one = 10;
  sint32 sint32_three = 11;
  sint64 sint64_seven = 12;
  sint64 sint64_nine = 13;
  bool flag = 14;
  Status status = 15;
  uint64 uint64_two = 16;
}

// Strings alone: ASCII at lengths on each side of 8, 16 and 32 octets, where a UTF-8 check
// changes its step, and two that hold Latin and CJK characters.
message Strings {
  string one = 1;
  string three = 2;
  string seven = 3;
  string eight = 4;
  string fifteen = 5;
  string sixteen = 6;
  string thirty_one = 7;
  string thirty_two = 8;
  string sixty_four = 9;
  string latin = 10;
  string cjk = 11;
}

// Nested messages alone: a tree whose nodes hold nothing but their children.
message Tree {
  repeated Tree children = 1;
}

// Packed repeated scalars alone: small and wide varints, zigzag and doubles.
message Packed {
  repeated int32 small = 1;
  repeated uint64 wide = 2;
  repeated sint32 zigzag = 3;
  repeated double reals = 4;
}
