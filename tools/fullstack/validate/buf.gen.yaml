# `tools/generate_check.sh` runs `buf generate --template tools/fullstack/validate/buf.gen.yaml`
# from the root: the Zig code of the full-stack check's validated OTLP schema, with the plugin
# this repository builds. The schema imports validate.proto from the root's buf workspace.
version: v2
inputs:
  - directory: tools/fullstack/validate/proto
plugins:
  - local: zig-out/bin/protoc-gen-connect-zig
    out: tools/fullstack/validate/gen
