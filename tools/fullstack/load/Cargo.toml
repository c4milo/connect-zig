[package]
name = "fullstack-load"
version = "0.1.0"
edition = "2021"
publish = false

# The load of tools/fullstack/production.sh: OTLP exports over gRPC at fixed rates, on connections
# that stay open across the steps of a climb (docs/benchmarks.md, the limits of the full stack).
[dependencies]
bytes = "1.12.1"
h2 = "0.4.20"
http = "1.5.0"
# ring alone, so the build needs no CMake, and TLS 1.3 with one suite, which every server must
# then choose (RFC 9846 §9.1 makes TLS_AES_128_GCM_SHA256 mandatory).
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2.2.0"
tokio = { version = "1.54.1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }

[profile.release]
codegen-units = 1
lto = "fat"
