[package]
name = "fullstack-connect-rust"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
buffa = "0.9.2"
connectrpc = { version = "0.9.1", features = ["server-tls"] }
# The validators its plugin writes as Rust code over Buffa's views, which the receiver runs on
# each export with `validate` (tools/fullstack/validate). Its `connect` feature turns a broken
# rule into connect-rust's `invalid_argument`.
protovalidate-buffa = "0.8.0"
rustls = "0.23.35"
rustls-pemfile = "2.2.0"
# The generated messages derive serde's traits for proto3 JSON, which connect-rust turns on by
# default.
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }

[build-dependencies]
buffa = "0.9.2"
buffa-codegen = "0.9.2"
connectrpc-build = "0.9.0"
protoc-gen-protovalidate-buffa = "0.11.0"

[profile.release]
codegen-units = 1
