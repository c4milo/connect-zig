[package]
name = "interop-connect-rust"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
base64 = "0.22.1"
buffa = { version = "0.9.2", features = ["json"] }
buffa-types = { version = "0.9.2", features = ["json"] }
connectrpc = { version = "0.9.1", features = ["client-tls"] }
http = "1.3.1"
hyper-rustls = { version = "0.27.7", default-features = false, features = ["http1", "tls12"] }
hyper-util = { version = "0.1.17", features = ["client-legacy", "http1", "tokio"] }
rustls = "0.23.35"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync", "time"] }

[build-dependencies]
buffa-codegen = "0.9.2"
connectrpc-build = "0.9.0"
