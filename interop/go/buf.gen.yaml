# The Go code of the interop schema, which run.sh generates into gen/ before it builds, with the
# plugins it builds at the versions go.mod pins.
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/c4milo/connect-zig/interop/go/gen
inputs:
  - directory: ../../examples/proto
    paths:
      - ../../examples/proto/coverage/v1
      - ../../examples/proto/interop/v1
plugins:
  - local: protoc-gen-go
    out: gen
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: gen
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: gen
    opt: paths=source_relative
