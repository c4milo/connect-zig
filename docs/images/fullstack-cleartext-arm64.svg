<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" width="840" height="340" role="img" aria-labelledby="t d">
<title id="t">The spans a second one core holds over cleartext h2, connect-zig against Collector, Rotel, as one gateway core for 33,000 servers</title>
<desc id="d">One core holds 4.0 times the Collector's and 3.5 times Rotel's spans a second, with p99 under 100 ms. connect-zig 783,184 spans a second at p99 69.67 ms, Collector 195,800 spans a second at p99 37.16 ms, Rotel 222,478 spans a second at p99 71.14 ms. p99 at each step: connect-zig: 9k 0.82 ms, 18k 0.81 ms, 27k 0.79 ms, 36k 0.79 ms, 53k 0.79 ms, 71k 0.79 ms, 107k 0.84 ms, 142k 0.83 ms, 214k 0.96 ms, 285k 1.11 ms, 356k 1.26 ms, 427k 1.34 ms, 570k 1.69 ms, 712k 8.4 ms, 783k 69.67 ms, 801k 128.24 ms refused, 819k 142.47 ms refused, 854k 142.95 ms refused; Collector: 9k 1.82 ms, 18k 2.09 ms, 27k 2.05 ms, 36k 2.26 ms, 53k 2.9 ms, 71k 4.32 ms, 107k 6.53 ms, 142k 15.6 ms, 178k 25.16 ms, 196k 37.16 ms, 205k 269.35 ms p99, 214k 1186.36 ms p99; Rotel: 9k 1.68 ms, 18k 2.92 ms, 27k 3.22 ms, 36k 5.23 ms, 53k 40.25 ms, 71k 41.07 ms, 107k 41.35 ms, 142k 42.73 ms, 214k 41.43 ms, 222k 71.14 ms, 231k 1301.09 ms p99, 249k 2047.77 ms p99, 285k 3142.9 ms p99.</desc>
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e4e3df; --zig:#2a78d6; --otel:#b07d00; --vector:#b8407f; --rotel:#722626; }
@media (prefers-color-scheme: dark) {
  svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#8f8e86; --grid:#33332f; --zig:#3987e5; --otel:#c99512; --vector:#d0599a; --rotel:#b84545; }
}
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
.title { font-size: 16px; font-weight: 600; }
.sub { font-size: 12.5px; fill: var(--ink2); }
.panel { font-size: 14px; font-weight: 600; }
.row { font-size: 12.5px; fill: var(--ink2); }
.val { font-size: 11px; font-weight: 600; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.tick { font-size: 11px; fill: var(--muted); }
.legend { font-size: 12.5px; fill: var(--ink2); }
</style>
<rect width="840" height="340" rx="8" fill="var(--surface)"/>
<text class="title" x="24" y="34">One core holds 4.0 times the Collector's and 3.5 times Rotel's spans a second, with p99 under 100 ms</text>
<text class="sub" x="24" y="56">Each server holds 516 connections over cleartext h2, as one core of a 64-core gateway for 33,000 servers, and</text>
<text class="sub" x="24" y="74">takes gzip OTLP exports of 16, 128 and 512 spans. The rate climbs until p99 passes 100 ms or a call is refused.</text>
<text class="sub" x="24" y="92">One CI job ran all, and checked every span: run 177, commit ca4bea6, Neoverse-N2, 4 cores.</text>
<rect x="24" y="102" width="12" height="12" rx="2" fill="var(--zig)"/>
<text class="legend" x="42" y="112">connect-zig</text>
<rect x="143" y="102" width="12" height="12" rx="2" fill="var(--otel)"/>
<text class="legend" x="161" y="112">OpenTelemetry Collector</text>
<rect x="346" y="102" width="12" height="12" rx="2" fill="var(--rotel)"/>
<text class="legend" x="364" y="112">Rotel</text>
<text class="panel" x="24" y="154">Spans a second one core holds</text>
<text class="row" x="118" y="194.0" text-anchor="end">connect-zig</text>
<path d="M128,180 h206.0 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-206.0 z" fill="var(--zig)"/>
<text class="val" x="132.0" y="213">783,184 spans/s, p99 69.67 ms</text>
<text class="row" x="118" y="236.0" text-anchor="end">Collector</text>
