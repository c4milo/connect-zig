<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" width="840" height="560" role="img" aria-labelledby="t d">
<title id="t">connect-zig and Buffa, connect-rust's codec, against Go's protobuf runtime, connect-go's codec</title>
<desc id="d">connect-zig is 2.9 to 18.1 times faster than Go and 1.1 to 1.9 times faster than Buffa. Each bar is a runtime's speed in multiples of Go's, which is the time of Go's google.golang.org/protobuf v1.36.12, connect-go's codec, over the runtime's time, for four messages and four operations. connect-zig: Small, 40 B: Binary encode 9.3x, Binary decode, every field read 6.7x, JSON encode 9.7x, JSON decode 11.8x; Medium, 1 KB: Binary encode 11.3x, Binary decode, every field read 10.6x, JSON encode 11.0x, JSON decode 18.1x; Large, 180 KB: Binary encode 3.2x, Binary decode, every field read 5.2x, JSON encode 7.6x, JSON decode 13.8x; Deep, 50 levels: Binary encode 2.9x, Binary decode, every field read 6.1x, JSON encode 17.8x, JSON decode 15.3x. Buffa 0.9.2, connect-rust's codec: Small, 40 B: Binary encode 5.9x, Binary decode, every field read 4.4x, JSON encode 8.7x, JSON decode 10.6x; Medium, 1 KB: Binary encode 9.0x, Binary decode, every field read 6.3x, JSON encode 7.1x, JSON decode 9.6x; Large, 180 KB: Binary encode 2.3x, Binary decode, every field read 3.3x, JSON encode 5.1x, JSON decode 9.8x; Deep, 50 levels: Binary encode 2.3x, Binary decode, every field read 3.2x, JSON encode 16.7x, JSON decode 8.2x.</desc>
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e4e3df; --zig:#2a78d6; --rust:#eb6834; --unit:#52514e; }
