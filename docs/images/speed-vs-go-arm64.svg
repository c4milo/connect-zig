<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" width="840" height="560" role="img" aria-labelledby="t d">
<title id="t">connect-zig and Buffa, connect-rust's codec, against Go's protobuf runtime, connect-go's codec</title>
<desc id="d">connect-zig is 3.2 to 18.9 times faster than Go and 1.1 to 2.2 times faster than Buffa. Each bar is a runtime's speed in multiples of Go's, which is the time of Go's google.golang.org/protobuf v1.36.12, connect-go's codec, over the runtime's time, for four messages and four operations. connect-zig: Small, 40 B: Binary encode 10.3x, Binary decode, every field read 7.3x, JSON encode 10.4x, JSON decode, every field read 11.6x; Medium, 1 KB: Binary encode 12.0x, Binary decode, every field read 11.0x, JSON encode 10.7x, JSON decode, every field read 15.1x; Large, 180 KB: Binary encode 3.2x, Binary decode, every field read 5.5x, JSON encode 7.6x, JSON decode, every field read 11.8x; Deep, 50 levels: Binary encode 3.4x, Binary decode, every field read 6.7x, JSON encode 18.9x, JSON decode, every field read 12.5x. Buffa 0.9.2, connect-rust's codec: Small, 40 B: Binary encode 6.5x, Binary decode, every field read 4.9x, JSON encode 9.5x, JSON decode, every field read 10.9x; Medium, 1 KB: Binary encode 9.8x, Binary decode, every field read 6.4x, JSON encode 8.5x, JSON decode, every field read 10.1x; Large, 180 KB: Binary encode 2.3x, Binary decode, every field read 3.2x, JSON encode 5.8x, JSON decode, every field read 9.9x; Deep, 50 levels: Binary encode 2.7x, Binary decode, every field read 3.0x, JSON encode 17.7x, JSON decode, every field read 7.9x.</desc>
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e4e3df; --zig:#2a78d6; --rust:#eb6834; --unit:#52514e; }
@media (prefers-color-scheme: dark) {
  svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#8f8e86; --grid:#33332f; --zig:#3987e5; --rust:#d95926; --unit:#c3c2b7; }
}
