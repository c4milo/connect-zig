.title { font-size: 17px; font-weight: 600; }
.sub { font-size: 12.5px; fill: var(--ink2); }
.panel { font-size: 14px; font-weight: 600; }
.row { font-size: 12.5px; fill: var(--ink2); }
.val { font-size: 11px; font-weight: 600; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.tick { font-size: 11px; fill: var(--muted); }
.note { font-size: 11.5px; fill: var(--ink2); }
.legend { font-size: 12.5px; fill: var(--ink2); }
</style>
<rect width="840" height="560" rx="8" fill="var(--surface)"/>
<text class="title" x="24" y="34">connect-zig is 3.2 to 20.8 times faster than Go and 1.1 to 2.2 times faster than Buffa</text>
<text class="sub" x="24" y="56">Each bar is a runtime's speed in multiples of Go's: Go's time over the runtime's time. A longer bar is faster.</text>
<text class="sub" x="24" y="74">One CI job ran all three, and each wrote the same octets: run 256, commit 57ec581, aarch64, Neoverse-N2.</text>
