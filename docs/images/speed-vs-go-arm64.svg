<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" width="840" height="560" role="img" aria-labelledby="t d">
<title id="t">connect-zig and Buffa, connect-rust's codec, against Go's protobuf runtime, connect-go's codec</title>
<desc id="d">connect-zig is 3.2 to 19.2 times faster than Go and 1.0 to 2.2 times faster than Buffa. Each bar is a runtime's speed in multiples of Go's, which is the time of Go's google.golang.org/protobuf v1.36.12, connect-go's codec, over the runtime's time, for four messages and four operations. connect-zig: Small, 40 B: Binary encode 10.1x, Binary decode, every field read 7.4x, JSON encode 10.5x, JSON decode 11.7x; Medium, 1 KB: Binary encode 11.8x, Binary decode, every field read 10.9x, JSON encode 10.8x, JSON decode 18.4x; Large, 180 KB: Binary encode 3.2x, Binary decode, every field read 5.6x, JSON encode 7.6x, JSON decode 13.6x; Deep, 50 levels: Binary encode 3.4x, Binary decode, every field read 6.5x, JSON encode 19.2x, JSON decode 14.9x. Buffa 0.9.2, connect-rust's codec: Small, 40 B: Binary encode 6.4x, Binary decode, every field read 4.9x, JSON encode 9.6x, JSON decode 10.9x; Medium, 1 KB: Binary encode 9.6x, Binary decode, every field read 6.3x, JSON encode 8.6x, JSON decode 9.8x; Large, 180 KB: Binary encode 2.3x, Binary decode, every field read 3.4x, JSON encode 5.8x, JSON decode 9.9x; Deep, 50 levels: Binary encode 2.8x, Binary decode, every field read 3.0x, JSON encode 18.5x, JSON decode 7.9x.</desc>
<style>
