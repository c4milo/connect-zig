<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" width="840" height="560" role="img" aria-labelledby="t d">
<title id="t">connect-zig and Buffa, connect-rust's codec, against Go's protobuf runtime, connect-go's codec</title>
<desc id="d">connect-zig is 2.9 to 19.5 times faster than Go and 1.1 to 1.9 times faster than Buffa. Each bar is a runtime's speed in multiples of Go's, which is the time of Go's google.golang.org/protobuf v1.36.12, connect-go's codec, over the runtime's time, for four messages and four operations. connect-zig: Small, 40 B: Binary encode 9.3x, Binary decode, every field read 7.0x, JSON encode 10.6x, JSON decode 11.7x; Medium, 1 KB: Binary encode 11.3x, Binary decode, every field read 11.0x, JSON encode 10.5x, JSON decode 18.2x; Large, 180 KB: Binary encode 3.2x, Binary decode, every field read 5.5x, JSON encode 7.8x, JSON decode 13.9x; Deep, 50 levels: Binary encode 2.9x, Binary decode, every field read 6.2x, JSON encode 19.5x, JSON decode 15.5x. Buffa 0.9.2, connect-rust's codec: Small, 40 B: Binary encode 5.8x, Binary decode, every field read 4.6x, JSON encode 9.1x, JSON decode 10.6x; Medium, 1 KB: Binary encode 9.0x, Binary decode, every field read 6.7x, JSON encode 7.3x, JSON decode 9.7x; Large, 180 KB: Binary encode 2.3x, Binary decode, every field read 3.3x, JSON encode 5.3x, JSON decode 9.8x; Deep, 50 levels: Binary encode 2.2x, Binary decode, every field read 3.3x, JSON encode 18.4x, JSON decode 8.1x.</desc>
<style>
