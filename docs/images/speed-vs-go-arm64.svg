<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" width="840" height="560" role="img" aria-labelledby="t d">
<title id="t">connect-zig and Buffa against Go's protobuf runtime</title>
<desc id="d">connect-zig is 3.0 to 16.8 times faster than Go; Buffa beats it in 3 of 16 cells. Each bar is a runtime's speed in multiples of Go's, which is the time of Go, google.golang.org/protobuf v1.36.12, over the runtime's time, for four messages and four operations. connect-zig: Small, 40 B: Binary encode 9.2x, Binary decode, every field read 7.3x, JSON encode 9.0x, JSON decode 9.9x; Medium, 1 KB: Binary encode 11.4x, Binary decode, every field read 11.0x, JSON encode 10.2x, JSON decode 16.8x; Large, 180 KB: Binary encode 3.2x, Binary decode, every field read 5.4x, JSON encode 7.2x, JSON decode 11.9x; Deep, 50 levels: Binary encode 3.0x, Binary decode, every field read 6.0x, JSON encode 16.8x, JSON decode 12.9x. Rust, Buffa 0.9.2: Small, 40 B: Binary encode 5.8x, Binary decode, every field read 4.7x, JSON encode 9.3x, JSON decode 10.5x; Medium, 1 KB: Binary encode 9.2x, Binary decode, every field read 6.6x, JSON encode 7.2x, JSON decode 9.8x; Large, 180 KB: Binary encode 2.3x, Binary decode, every field read 3.3x, JSON encode 5.1x, JSON decode 10.2x; Deep, 50 levels: Binary encode 2.3x, Binary decode, every field read 3.2x, JSON encode 18.3x, JSON decode 8.1x.</desc>
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e4e3df; --zig:#2a78d6; --rust:#eb6834; --unit:#52514e; }
@media (prefers-color-scheme: dark) {
