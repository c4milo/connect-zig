<text class="title" x="24" y="34">connect-zig is 2.9 to 18.1 times faster than Go and 1.1 to 1.9 times faster than Buffa</text>
<text class="sub" x="24" y="56">Each bar is a runtime's speed in multiples of Go's: Go's time over the runtime's time. A longer bar is faster.</text>
<text class="sub" x="24" y="74">One CI job ran all three, and each wrote the same octets: run 160, commit b96f830, aarch64, Neoverse-N2.</text>
