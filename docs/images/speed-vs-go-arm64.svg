<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" width="840" height="560" role="img" aria-labelledby="t d">
<title id="t">connect-zig and Buffa against Go's protobuf runtime</title>
<desc id="d">connect-zig is 2.9 to 15.1 times faster than Go; Buffa beats it in 3 of 16 cells. Each bar is a runtime's speed in multiples of Go's, which is the time of Go, google.golang.org/protobuf v1.36.12, over the runtime's time, for four messages and four operations. connect-zig: Small, 40 B: Binary encode 9.3x, Binary decode, every field read 7.2x, JSON encode 8.7x, JSON decode 9.8x; Medium, 1 KB: Binary encode 11.8x, Binary decode, every field read 11.1x, JSON encode 10.7x, JSON decode 15.1x; Large, 180 KB: Binary encode 3.2x, Binary decode, every field read 5.2x, JSON encode 7.2x, JSON decode 10.7x; Deep, 50 levels: Binary encode 2.9x, Binary decode, every field read 5.0x, JSON encode 15.0x, JSON decode 10.8x. Rust, Buffa 0.9.2: Small, 40 B: Binary encode 5.8x, Binary decode, every field read 4.5x, JSON encode 9.2x, JSON decode 11.0x; Medium, 1 KB: Binary encode 9.4x, Binary decode, every field read 6.6x, JSON encode 7.5x, JSON decode 10.0x; Large, 180 KB: Binary encode 2.3x, Binary decode, every field read 3.2x, JSON encode 5.2x, JSON decode 10.2x; Deep, 50 levels: Binary encode 2.4x, Binary decode, every field read 3.2x, JSON encode 17.8x, JSON decode 8.2x.</desc>
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e4e3df; --zig:#2a78d6; --rust:#eb6834; --unit:#52514e; }
@media (prefers-color-scheme: dark) {
