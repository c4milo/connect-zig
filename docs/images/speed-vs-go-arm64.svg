<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" width="840" height="560" role="img" aria-labelledby="t d">
<title id="t">connect-zig and Buffa, connect-rust's codec, against Go's protobuf runtime, connect-go's codec</title>
<desc id="d">connect-zig is 3.2 to 20.8 times faster than Go and 1.1 to 2.2 times faster than Buffa. Each bar is a runtime's speed in multiples of Go's, which is the time of Go's google.golang.org/protobuf v1.36.12, connect-go's codec, over the runtime's time, for four messages and four operations. connect-zig: Small, 40 B: Binary encode 10.1x, Binary decode, every field read 6.9x, JSON encode 10.9x, JSON decode 11.6x; Medium, 1 KB: Binary encode 11.8x, Binary decode, every field read 11.3x, JSON encode 11.2x, JSON decode 18.6x; Large, 180 KB: Binary encode 3.2x, Binary decode, every field read 5.3x, JSON encode 8.1x, JSON decode 13.6x; Deep, 50 levels: Binary encode 3.4x, Binary decode, every field read 6.9x, JSON encode 20.8x, JSON decode 15.2x. Buffa 0.9.2, connect-rust's codec: Small, 40 B: Binary encode 6.5x, Binary decode, every field read 4.8x, JSON encode 10.2x, JSON decode 10.9x; Medium, 1 KB: Binary encode 9.7x, Binary decode, every field read 6.5x, JSON encode 8.7x, JSON decode 10.0x; Large, 180 KB: Binary encode 2.3x, Binary decode, every field read 3.2x, JSON encode 6.1x, JSON decode 9.9x; Deep, 50 levels: Binary encode 2.8x, Binary decode, every field read 3.1x, JSON encode 18.8x, JSON decode 8.0x.</desc>
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e4e3df; --zig:#2a78d6; --rust:#eb6834; --unit:#52514e; }
@media (prefers-color-scheme: dark) {
