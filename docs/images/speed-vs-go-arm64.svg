<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" width="840" height="560" role="img" aria-labelledby="t d">
<title id="t">connect-zig and Buffa, connect-rust's codec, against Go's protobuf runtime, connect-go's codec</title>
<desc id="d">connect-zig is 3.2 to 20.0 times faster than Go and 1.1 to 2.2 times faster than Buffa. Each bar is a runtime's speed in multiples of Go's, which is the time of Go's google.golang.org/protobuf v1.36.12, connect-go's codec, over the runtime's time, for four messages and four operations. connect-zig: Small, 40 B: Binary encode 10.1x, Binary decode, every field read 7.5x, JSON encode 10.5x, JSON decode 11.4x; Medium, 1 KB: Binary encode 11.9x, Binary decode, every field read 11.1x, JSON encode 10.6x, JSON decode 18.3x; Large, 180 KB: Binary encode 3.2x, Binary decode, every field read 5.6x, JSON encode 7.8x, JSON decode 13.7x; Deep, 50 levels: Binary encode 3.4x, Binary decode, every field read 6.8x, JSON encode 20.0x, JSON decode 15.1x. Buffa 0.9.2, connect-rust's codec: Small, 40 B: Binary encode 6.4x, Binary decode, every field read 5.0x, JSON encode 9.6x, JSON decode 10.8x; Medium, 1 KB: Binary encode 9.6x, Binary decode, every field read 6.5x, JSON encode 8.5x, JSON decode 9.8x; Large, 180 KB: Binary encode 2.3x, Binary decode, every field read 3.4x, JSON encode 6.0x, JSON decode 10.0x; Deep, 50 levels: Binary encode 2.7x, Binary decode, every field read 3.1x, JSON encode 19.1x, JSON decode 8.0x.</desc>
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e4e3df; --zig:#2a78d6; --rust:#eb6834; --unit:#52514e; }
@media (prefers-color-scheme: dark) {
