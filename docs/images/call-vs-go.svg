<line x1="754.5" y1="160" x2="754.5" y2="234" stroke="var(--grid)" stroke-width="1"/>
<text class="tick" x="754.5" y="248" text-anchor="middle">12×</text>
<text class="row" x="534" y="182.0" text-anchor="end">Small, 40 B</text>
<path d="M544.0,164 h218.6 a4.0,4.0 0 0 1 4.0,4.0 v5.0 a4.0,4.0 0 0 1 -4.0,4.0 h-218.6 z" fill="var(--zig)"/>
<text class="val" x="771.6" y="174">12.7×, 0.50 µs</text>
<path d="M544.0,179 h42.6 a4.0,4.0 0 0 1 4.0,4.0 v5.0 a4.0,4.0 0 0 1 -4.0,4.0 h-42.6 z" fill="var(--rust)"/>
<text class="val" x="595.6" y="189">2.7×</text>
<text class="row" x="534" y="220.0" text-anchor="end">Medium, 1 KB</text>
<path d="M544.0,202 h190.9 a4.0,4.0 0 0 1 4.0,4.0 v5.0 a4.0,4.0 0 0 1 -4.0,4.0 h-190.9 z" fill="var(--zig)"/>
<text class="val" x="743.9" y="212">11.1×, 2.29 µs</text>
<path d="M544.0,217 h52.3 a4.0,4.0 0 0 1 4.0,4.0 v5.0 a4.0,4.0 0 0 1 -4.0,4.0 h-52.3 z" fill="var(--rust)"/>
<text class="val" x="605.3" y="227">3.2×</text>
<line x1="561.5" y1="156" x2="561.5" y2="234" stroke="var(--unit)" stroke-width="1.5" stroke-dasharray="4 3"/>
</svg>
