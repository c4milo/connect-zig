<text class="val" x="289.1" y="212">12.3×, 1.68 µs</text>
<path d="M136.0,217 h44.4 a4.0,4.0 0 0 1 4.0,4.0 v5.0 a4.0,4.0 0 0 1 -4.0,4.0 h-44.4 z" fill="var(--rust)"/>
<text class="val" x="189.4" y="227">4.0×</text>
