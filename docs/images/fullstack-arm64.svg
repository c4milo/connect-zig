<text class="row" x="118" y="362.0" text-anchor="end">connect-rust</text>
<path d="M128,348 h76.8 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-76.8 z" fill="var(--rust)"/>
<text class="val" x="132.0" y="381">266,990 spans/s, p99 23.8 ms, connect-zig 2.6×</text>
<text class="panel" x="408" y="154">p99 as the rate climbs</text>
