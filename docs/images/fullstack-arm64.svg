<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 398" width="840" height="398" role="img" aria-labelledby="t d">
<title id="t">The spans a second one core holds over TLS, connect-zig against Collector, Vector, connect-go, connect-rust, as one gateway core for 33,000 servers</title>
<desc id="d">One core holds 7.1 times connect-go's and 2.6 times connect-rust's spans a second. connect-zig 694,200 spans a second at p99 16.06 ms, Collector 204,696 spans a second at p99 43.65 ms, Vector 66,750 spans a second at p99 46.56 ms, connect-go 97,898 spans a second at p99 97.15 ms, connect-rust 266,990 spans a second at p99 23.8 ms. p99 at each step: connect-zig: 9k 0.87 ms, 18k 0.86 ms, 27k 0.86 ms, 36k 0.85 ms, 53k 0.85 ms, 71k 0.84 ms, 107k 0.86 ms, 142k 0.96 ms, 214k 1 ms, 285k 1.2 ms, 356k 1.37 ms, 427k 1.54 ms, 570k 1.92 ms, 641k 3.02 ms, 676k 7.17 ms, 694k 16.06 ms, 712k 21.69 ms refused; Collector: 9k 2.11 ms, 18k 1.94 ms, 27k 2.03 ms, 36k 2.13 ms, 53k 2.41 ms, 71k 4.79 ms, 107k 9.23 ms, 142k 15.37 ms, 178k 30.16 ms, 196k 38.35 ms, 205k 43.65 ms, 214k 126.69 ms p99; Vector: 9k 5.36 ms, 18k 5.61 ms, 27k 7.38 ms, 36k 43.63 ms, 53k 45.98 ms, 62k 45.78 ms, 67k 46.56 ms, 69k 328.62 ms p99, 71k 555.28 ms p99; connect-go: 9k 4.03 ms, 18k 4.23 ms, 27k 5.11 ms, 36k 5.17 ms, 53k 7.88 ms, 71k 9.81 ms, 89k 15.16 ms, 98k 97.15 ms, 102k 401.89 ms p99, 107k 632.18 ms p99; connect-rust: 9k 1.33 ms, 18k 1.27 ms, 27k 1.27 ms, 36k 1.31 ms, 53k 1.39 ms, 71k 1.55 ms, 107k 1.77 ms, 142k 1.91 ms, 214k 2.32 ms, 249k 2.59 ms, 267k 23.8 ms, 276k 396.67 ms p99, 285k 748.99 ms p99.</desc>
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e4e3df; --zig:#2a78d6; --otel:#b07d00; --vector:#b8407f; --rotel:#722626; --go:#1a8a82; --rust:#b5562b; }
@media (prefers-color-scheme: dark) {
  svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#8f8e86; --grid:#33332f; --zig:#3987e5; --otel:#c99512; --vector:#d0599a; --rotel:#b84545; --go:#2fa59c; --rust:#d06d3f; }
}
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
.title { font-size: 16px; font-weight: 600; }
.sub { font-size: 12.5px; fill: var(--ink2); }
.panel { font-size: 14px; font-weight: 600; }
.row { font-size: 12.5px; fill: var(--ink2); }
.val { font-size: 11px; font-weight: 600; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.tick { font-size: 11px; fill: var(--muted); }
.legend { font-size: 12.5px; fill: var(--ink2); }
</style>
<rect width="840" height="398" rx="8" fill="var(--surface)"/>
<text class="title" x="24" y="34">One core holds 7.1 times connect-go's and 2.6 times connect-rust's spans a second</text>
<text class="sub" x="24" y="56">Each server holds 516 connections over TLS, as one core of a 64-core gateway for 33,000 servers, and</text>
<text class="sub" x="24" y="74">takes gzip OTLP exports of 16, 128 and 512 spans. The rate climbs until p99 passes 100 ms or a call is refused.</text>
<text class="sub" x="24" y="92">One CI job ran all, and checked every span: run 185, commit af0b01e, Neoverse-N2, 4 cores.</text>
<rect x="24" y="102" width="12" height="12" rx="2" fill="var(--zig)"/>
<text class="legend" x="42" y="112">connect-zig</text>
<rect x="143" y="102" width="12" height="12" rx="2" fill="var(--otel)"/>
<text class="legend" x="161" y="112">OpenTelemetry Collector</text>
<rect x="346" y="102" width="12" height="12" rx="2" fill="var(--vector)"/>
<text class="legend" x="364" y="112">Vector</text>
