<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 416" width="840" height="416" role="img" aria-labelledby="t d">
<title id="t">The spans a second one core holds over TLS, connect-zig against Collector, Vector, connect-go, connect-rust, as one gateway core for 33,000 servers</title>
<desc id="d">One core holds 8.0 times connect-go's and 2.8 times connect-rust's spans a second. connect-zig 760,998 spans a second at p99 92.9 ms, Collector 213,600 spans a second at p99 57.04 ms, Vector 66,748 spans a second at p99 46.87 ms, connect-go 95,668 spans a second at p99 99.65 ms, connect-rust 275,894 spans a second at p99 81.73 ms. p99 at each step: connect-zig: 9k 0.81 ms, 18k 0.82 ms, 27k 0.8 ms, 36k 0.8 ms, 53k 0.81 ms, 71k 0.8 ms, 107k 0.8 ms, 142k 0.89 ms, 214k 0.94 ms, 285k 1.12 ms, 356k 1.33 ms, 427k 1.4 ms, 570k 1.76 ms, 712k 9.83 ms, 748k 51.13 ms, 756k 61.38 ms, 761k 92.9 ms, 765k 121.96 ms p99, 783k 212.11 ms refused, 854k 219.06 ms refused; Collector: 9k 2.17 ms, 18k 1.87 ms, 27k 2.02 ms, 36k 1.82 ms, 53k 2.33 ms, 71k 3.85 ms, 107k 8.84 ms, 142k 15.41 ms, 214k 57.04 ms, 216k 123.9 ms p99, 218k 129.74 ms p99, 222k 397.06 ms p99, 231k 638.31 ms p99, 249k 1247.05 ms p99, 285k 1998.06 ms p99; Vector: 9k 4.86 ms, 18k 5.39 ms, 27k 7.61 ms, 36k 43.97 ms, 53k 46.14 ms, 62k 46.04 ms, 67k 46.87 ms, 67k 112.4 ms p99, 68k 243.87 ms p99, 69k 341.16 ms p99, 71k 504.7 ms p99; connect-go: 9k 4.92 ms, 18k 4.03 ms, 27k 4.39 ms, 36k 6.76 ms, 53k 7.18 ms, 71k 11.84 ms, 89k 16.81 ms, 93k 19.27 ms, 96k 99.65 ms, 97k 154.85 ms p99, 98k 231.65 ms p99, 107k 1023.87 ms p99; connect-rust: 9k 1.31 ms, 18k 1.33 ms, 27k 1.29 ms, 36k 1.35 ms, 53k 1.38 ms, 71k 1.52 ms, 107k 1.75 ms, 142k 1.87 ms, 214k 2.22 ms, 249k 2.63 ms, 267k 2.99 ms, 276k 81.73 ms, 278k 272.58 ms p99, 280k 411.18 ms p99, 285k 758 ms p99.</desc>
<style>
