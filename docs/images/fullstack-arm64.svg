<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 398" width="840" height="398" role="img" aria-labelledby="t d">
<title id="t">The spans a second one core holds over TLS, connect-zig against Collector, Vector, connect-go, connect-rust, as one gateway core for 33,000 servers</title>
<desc id="d">One core holds 8.0 times connect-go's and 2.7 times connect-rust's spans a second. connect-zig 712,016 spans a second at p99 84.19 ms, Collector 204,696 spans a second at p99 44.55 ms, Vector 66,748 spans a second at p99 46.39 ms, connect-go 89,002 spans a second at p99 15.15 ms, connect-rust 267,000 spans a second at p99 25.73 ms. p99 at each step: connect-zig: 9k 0.87 ms, 18k 0.87 ms, 27k 0.89 ms, 36k 0.88 ms, 53k 0.89 ms, 71k 0.87 ms, 107k 0.88 ms, 142k 0.97 ms, 214k 1.06 ms, 285k 1.23 ms, 356k 1.39 ms, 427k 1.6 ms, 570k 1.99 ms, 712k 84.19 ms, 730k 109.46 ms p99, 748k 210.97 ms refused, 783k 318.91 ms refused, 854k 2226.44 ms refused; Collector: 9k 2.07 ms, 18k 1.94 ms, 27k 2.07 ms, 36k 2.04 ms, 53k 2.99 ms, 71k 5.78 ms, 107k 9.08 ms, 142k 15.88 ms, 178k 34.48 ms, 196k 41.96 ms, 205k 44.55 ms, 214k 226.18 ms p99; Vector: 9k 4.92 ms, 18k 6.26 ms, 27k 7.34 ms, 36k 43.48 ms, 53k 46.22 ms, 62k 46.03 ms, 67k 46.39 ms, 69k 306.71 ms p99, 71k 572.15 ms p99; connect-go: 9k 3.15 ms, 18k 4.21 ms, 27k 5.3 ms, 36k 6.12 ms, 53k 8.85 ms, 71k 9.59 ms, 89k 15.15 ms, 93k 131.52 ms p99, 98k 312.37 ms p99, 107k 436.79 ms p99; connect-rust: 9k 1.4 ms, 18k 1.37 ms, 27k 1.39 ms, 36k 1.46 ms, 53k 1.55 ms, 71k 1.67 ms, 107k 1.91 ms, 142k 2.03 ms, 214k 2.59 ms, 249k 2.78 ms, 267k 25.73 ms, 276k 297.27 ms p99, 285k 1413.51 ms p99.</desc>
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e4e3df; --zig:#2a78d6; --otel:#b07d00; --vector:#b8407f; --rotel:#722626; --go:#1a8a82; --rust:#b5562b; }
@media (prefers-color-scheme: dark) {
  svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#8f8e86; --grid:#33332f; --zig:#3987e5; --otel:#c99512; --vector:#d0599a; --rotel:#b84545; --go:#2fa59c; --rust:#d06d3f; }
}
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
.title { font-size: 16px; font-weight: 600; }
.sub { font-size: 12.5px; fill: var(--ink2); }
.panel { font-size: 14px; font-weight: 600; }
.row { font-size: 12.5px; fill: var(--ink2); }
.val { font-size: 11px; font-weight: 600; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.tick { font-size: 11px; fill: var(--muted); }
.legend { font-size: 12.5px; fill: var(--ink2); }
</style>
<rect width="840" height="398" rx="8" fill="var(--surface)"/>
<text class="title" x="24" y="34">One core holds 8.0 times connect-go's and 2.7 times connect-rust's spans a second</text>
<text class="sub" x="24" y="56">Each server holds 516 connections over TLS, as one core of a 64-core gateway for 33,000 servers, and</text>
<text class="sub" x="24" y="74">takes gzip OTLP exports of 16, 128 and 512 spans. The rate climbs until p99 passes 100 ms or a call is refused.</text>
<text class="sub" x="24" y="92">One CI job ran all, and checked every span: run 191, commit fa83b86, Neoverse-N2, 4 cores.</text>
<rect x="24" y="102" width="12" height="12" rx="2" fill="var(--zig)"/>
<text class="legend" x="42" y="112">connect-zig</text>
<rect x="143" y="102" width="12" height="12" rx="2" fill="var(--otel)"/>
<text class="legend" x="161" y="112">OpenTelemetry Collector</text>
