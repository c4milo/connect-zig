<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 434" width="840" height="434" role="img" aria-labelledby="t d">
<title id="t">The spans a second one core holds over TLS, connect-zig against Collector, Vector, connect-go, connect-rust, as one gateway core for 33,000 servers</title>
<desc id="d">One core holds 7.0 times connect-go's and 2.7 times connect-rust's spans a second. connect-zig 711,570 spans a second at p99 88.57 ms, Collector 215,818 spans a second at p99 86.88 ms, Vector 82,310 spans a second at p99 29.92 ms, connect-go 101,213 spans a second at p99 30.33 ms, connect-rust 263,440 spans a second at p99 55.21 ms. p99 at each step: connect-zig: 9k 2.33 ms, 18k 2.36 ms, 27k 2.3 ms, 36k 2.3 ms, 53k 2.35 ms, 71k 2.39 ms, 107k 2.53 ms, 142k 2.65 ms, 214k 2.72 ms, 285k 3.1 ms, 356k 3.15 ms, 427k 3.39 ms, 570k 3.75 ms, 712k 88.06 ms, 730k 85.7 ms, 734k 116.18 ms p99, 739k 112.4 ms p99, 748k 129.62 ms p99, 783k 330.64 ms refused, 854k 377.79 ms refused; Collector: 9k 3.5 ms, 18k 3.4 ms, 27k 3.54 ms, 36k 3.44 ms, 53k 4.25 ms, 71k 5.58 ms, 107k 11.04 ms, 142k 17.18 ms, 214k 48.9 ms, 216k 86.88 ms, 218k 115.23 ms p99, 222k 148 ms p99, 231k 182.01 ms p99, 249k 1067.71 ms p99, 285k 4006.95 ms p99; Vector: 9k 6.05 ms, 18k 6.29 ms, 27k 6.55 ms, 36k 6.77 ms, 53k 7.22 ms, 71k 7.63 ms, 80k 15.78 ms, 82k 29.92 ms, 83k 2038.6 ms p99, 85k 2096.72 ms p99, 89k 2570.18 ms p99, 107k 4561.61 ms p99; connect-go: 9k 5.7 ms, 18k 6.17 ms, 27k 6.39 ms, 36k 7.93 ms, 53k 7.89 ms, 71k 12.31 ms, 89k 20.42 ms, 98k 23.66 ms, 100k 27.27 ms, 101k 30.33 ms, 102k 286.56 ms p99, 107k 1110.11 ms p99; connect-rust: 9k 2.76 ms, 18k 2.89 ms, 27k 2.86 ms, 36k 2.79 ms, 53k 2.93 ms, 71k 2.96 ms, 107k 3.14 ms, 142k 3.37 ms, 214k 3.63 ms, 285k 3.98 ms, 287k 979.72 ms p99, 289k 1254.1 ms p99, 294k 1934.93 ms p99, 303k 2500.6 ms p99, 320k 3603.86 ms p99, 356k 4609.44 ms p99.</desc>
