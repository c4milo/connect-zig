<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" width="840" height="340" role="img" aria-labelledby="t d">
<title id="t">The spans a second one core holds over TLS, connect-zig against Collector, Vector, as one gateway core for 33,000 servers</title>
<desc id="d">One core holds 5.0 times the Collector's and 13.3 times Vector's spans a second, with p99 under 100 ms. connect-zig 712,000 spans a second at p99 39.54 ms, Collector 142,400 spans a second at p99 16.5 ms, Vector 53,400 spans a second at p99 45.91 ms. p99 at each step: connect-zig: 9k 0.88 ms, 18k 0.86 ms, 27k 0.92 ms, 36k 0.86 ms, 53k 0.86 ms, 71k 0.86 ms, 107k 0.86 ms, 142k 0.94 ms, 214k 1.02 ms, 285k 1.18 ms, 356k 1.34 ms, 427k 1.45 ms, 570k 2.03 ms, 712k 39.54 ms, 854k 151.33 ms refused; Collector: 9k 2.04 ms, 18k 1.87 ms, 27k 2.06 ms, 36k 2.06 ms, 53k 2.39 ms, 71k 4.43 ms, 107k 10.16 ms, 142k 16.5 ms, 214k 115.87 ms p99; Vector: 9k 4.82 ms, 18k 5.75 ms, 27k 6.91 ms, 36k 41.21 ms, 53k 45.91 ms, 71k 438.09 ms p99.</desc>
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e4e3df; --zig:#2a78d6; --otel:#b07d00; --vector:#b8407f; --rotel:#722626; }
@media (prefers-color-scheme: dark) {
  svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#8f8e86; --grid:#33332f; --zig:#3987e5; --otel:#c99512; --vector:#d0599a; --rotel:#b84545; }
}
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
.title { font-size: 16px; font-weight: 600; }
.sub { font-size: 12.5px; fill: var(--ink2); }
.panel { font-size: 14px; font-weight: 600; }
.row { font-size: 12.5px; fill: var(--ink2); }
.val { font-size: 11px; font-weight: 600; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.tick { font-size: 11px; fill: var(--muted); }
.legend { font-size: 12.5px; fill: var(--ink2); }
</style>
<rect width="840" height="340" rx="8" fill="var(--surface)"/>
<text class="title" x="24" y="34">One core holds 5.0 times the Collector's and 13.3 times Vector's spans a second, with p99 under 100 ms</text>
<text class="sub" x="24" y="56">Each server holds 516 connections over TLS, as one core of a 64-core gateway for 33,000 servers, and</text>
<text class="sub" x="24" y="74">takes gzip OTLP exports of 16, 128 and 512 spans. The rate climbs until p99 passes 100 ms or a call is refused.</text>
<text class="sub" x="24" y="92">One CI job ran all, and checked every span: run 172, commit c2c75dd, Neoverse-N2, 4 cores.</text>
<rect x="24" y="102" width="12" height="12" rx="2" fill="var(--zig)"/>
<text class="legend" x="42" y="112">connect-zig</text>
<rect x="143" y="102" width="12" height="12" rx="2" fill="var(--otel)"/>
<text class="legend" x="161" y="112">OpenTelemetry Collector</text>
<rect x="346" y="102" width="12" height="12" rx="2" fill="var(--vector)"/>
<text class="legend" x="364" y="112">Vector</text>
<text class="panel" x="24" y="154">Spans a second one core holds</text>
<text class="row" x="118" y="194.0" text-anchor="end">connect-zig</text>
<path d="M128,180 h206.0 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-206.0 z" fill="var(--zig)"/>
<text class="val" x="132.0" y="213">712,000 spans/s, p99 39.54 ms</text>
<text class="row" x="118" y="236.0" text-anchor="end">Collector</text>
<path d="M128,222 h38.0 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-38.0 z" fill="var(--otel)"/>
<text class="val" x="132.0" y="255">142,400 spans/s, p99 16.5 ms</text>
<text class="row" x="118" y="278.0" text-anchor="end">Vector</text>
<path d="M128,264 h11.8 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-11.8 z" fill="var(--vector)"/>
<text class="val" x="132.0" y="297">53,400 spans/s, p99 45.91 ms</text>
<text class="panel" x="408" y="154">p99 as the rate climbs</text>
<line x1="448" y1="285.3" x2="800" y2="285.3" stroke="var(--grid)" stroke-width="1"/>
<text class="tick" x="442" y="289.3" text-anchor="end">1 ms</text>
