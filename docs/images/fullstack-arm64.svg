<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 416" width="840" height="416" role="img" aria-labelledby="t d">
<title id="t">The spans a second one core holds over TLS, connect-zig against Collector, Vector, connect-go, connect-rust, as one gateway core for 33,000 servers</title>
<desc id="d">One core holds 7.9 times connect-go's and 2.8 times connect-rust's spans a second. connect-zig 765,400 spans a second at p99 96.12 ms, Collector 211,372 spans a second at p99 40.69 ms, Vector 68,430 spans a second at p99 46.28 ms, connect-go 96,746 spans a second at p99 68.1 ms, connect-rust 269,250 spans a second at p99 18.37 ms. p99 at each step: connect-zig: 9k 0.82 ms, 18k 0.79 ms, 27k 0.79 ms, 36k 0.79 ms, 53k 0.78 ms, 71k 0.78 ms, 107k 0.8 ms, 142k 0.9 ms, 214k 0.92 ms, 285k 1.11 ms, 356k 1.31 ms, 427k 1.43 ms, 570k 1.87 ms, 712k 8.1 ms, 748k 53.55 ms, 765k 96.12 ms, 770k 135.55 ms p99, 774k 159.83 ms p99, 783k 181.95 ms refused, 854k 319.24 ms refused; Collector: 9k 2.01 ms, 18k 1.82 ms, 27k 1.97 ms, 36k 2.13 ms, 53k 2.44 ms, 71k 5.03 ms, 107k 8.95 ms, 142k 14.85 ms, 178k 27.82 ms, 196k 32.47 ms, 205k 36.87 ms, 209k 37.99 ms, 211k 40.69 ms, 214k 182.54 ms p99; Vector: 9k 4.34 ms, 18k 5.29 ms, 27k 7.09 ms, 36k 41.38 ms, 53k 45.38 ms, 62k 45.82 ms, 67k 45.39 ms, 68k 45.74 ms, 68k 46.28 ms, 69k 148.57 ms p99, 71k 150.25 ms p99; connect-go: 9k 3.66 ms, 18k 4.96 ms, 27k 4.07 ms, 36k 6.64 ms, 53k 6.55 ms, 71k 10.29 ms, 89k 15.44 ms, 93k 17.14 ms, 96k 60.93 ms, 97k 68.1 ms, 98k 165.72 ms p99, 107k 456.79 ms p99; connect-rust: 9k 1.29 ms, 18k 1.27 ms, 27k 1.31 ms, 36k 1.34 ms, 53k 1.34 ms, 71k 1.49 ms, 107k 1.67 ms, 142k 1.83 ms, 214k 2.27 ms, 249k 2.55 ms, 267k 11.45 ms, 269k 18.37 ms, 271k 114.96 ms p99, 276k 115.02 ms p99, 285k 791.22 ms p99.</desc>
<style>
