<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 398" width="840" height="398" role="img" aria-labelledby="t d">
<title id="t">The spans a second one core holds over TLS, connect-zig against Collector, Vector, connect-go, connect-rust, as one gateway core for 33,000 servers</title>
<desc id="d">One core holds 8.2 times connect-go's and 2.8 times connect-rust's spans a second. connect-zig 729,750 spans a second at p99 54.77 ms, Collector 195,800 spans a second at p99 47.73 ms, Vector 62,302 spans a second at p99 45.85 ms, connect-go 89,000 spans a second at p99 18.84 ms, connect-rust 258,090 spans a second at p99 2.88 ms. p99 at each step: connect-zig: 9k 0.87 ms, 18k 0.87 ms, 27k 0.86 ms, 36k 0.86 ms, 53k 0.86 ms, 71k 0.85 ms, 107k 0.85 ms, 142k 0.95 ms, 214k 1 ms, 285k 1.18 ms, 356k 1.39 ms, 427k 1.51 ms, 570k 1.83 ms, 712k 24.76 ms, 730k 54.77 ms, 748k 77.43 ms refused, 783k 140.4 ms refused, 854k 357.01 ms refused; Collector: 9k 2.06 ms, 18k 1.72 ms, 27k 2 ms, 36k 2.22 ms, 53k 3.19 ms, 71k 3.83 ms, 107k 9.65 ms, 142k 14.7 ms, 178k 33.18 ms, 196k 47.73 ms, 205k 174.31 ms p99, 214k 116.44 ms p99; Vector: 9k 5 ms, 18k 6.27 ms, 27k 7.96 ms, 36k 44.35 ms, 53k 46.32 ms, 62k 45.85 ms, 65k 127.18 ms p99, 67k 233.47 ms p99, 71k 794.69 ms p99; connect-go: 9k 3.21 ms, 18k 4.67 ms, 27k 5.97 ms, 36k 6.47 ms, 53k 8.11 ms, 71k 10.54 ms, 89k 18.84 ms, 93k 256.99 ms p99, 98k 325.73 ms p99, 107k 1545.7 ms p99; connect-rust: 9k 1.41 ms, 18k 1.28 ms, 27k 1.25 ms, 36k 1.28 ms, 53k 1.35 ms, 71k 1.47 ms, 107k 1.71 ms, 142k 1.87 ms, 214k 2.38 ms, 249k 4.62 ms, 258k 2.88 ms, 267k 224.99 ms p99, 285k 1580.87 ms p99.</desc>
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e4e3df; --zig:#2a78d6; --otel:#b07d00; --vector:#b8407f; --rotel:#722626; --go:#1a8a82; --rust:#b5562b; }
@media (prefers-color-scheme: dark) {
  svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#8f8e86; --grid:#33332f; --zig:#3987e5; --otel:#c99512; --vector:#d0599a; --rotel:#b84545; --go:#2fa59c; --rust:#d06d3f; }
}
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
.title { font-size: 16px; font-weight: 600; }
.sub { font-size: 12.5px; fill: var(--ink2); }
.panel { font-size: 14px; font-weight: 600; }
.row { font-size: 12.5px; fill: var(--ink2); }
.val { font-size: 11px; font-weight: 600; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.tick { font-size: 11px; fill: var(--muted); }
.legend { font-size: 12.5px; fill: var(--ink2); }
</style>
<rect width="840" height="398" rx="8" fill="var(--surface)"/>
<text class="title" x="24" y="34">One core holds 8.2 times connect-go's and 2.8 times connect-rust's spans a second</text>
<text class="sub" x="24" y="56">Each server holds 516 connections over TLS, as one core of a 64-core gateway for 33,000 servers, and</text>
<text class="sub" x="24" y="74">takes gzip OTLP exports of 16, 128 and 512 spans. The rate climbs until p99 passes 100 ms or a call is refused.</text>
<text class="sub" x="24" y="92">One CI job ran all, and checked every span: run 182, commit 15e6986, Neoverse-N2, 4 cores.</text>
<rect x="24" y="102" width="12" height="12" rx="2" fill="var(--zig)"/>
<text class="legend" x="42" y="112">connect-zig</text>
<rect x="143" y="102" width="12" height="12" rx="2" fill="var(--otel)"/>
<text class="legend" x="161" y="112">OpenTelemetry Collector</text>
<rect x="346" y="102" width="12" height="12" rx="2" fill="var(--vector)"/>
<text class="legend" x="364" y="112">Vector</text>
<rect x="430" y="102" width="12" height="12" rx="2" fill="var(--go)"/>
<text class="legend" x="448" y="112">connect-go</text>
<rect x="542" y="102" width="12" height="12" rx="2" fill="var(--rust)"/>
<text class="legend" x="560" y="112">connect-rust</text>
