<text class="val" x="132.0" y="255">195,800 spans/s, p99 47.73 ms, connect-zig 3.7×</text>
<text class="row" x="118" y="278.0" text-anchor="end">Vector</text>
<path d="M128,264 h13.9 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-13.9 z" fill="var(--vector)"/>
<text class="val" x="132.0" y="297">62,302 spans/s, p99 45.85 ms, connect-zig 11.7×</text>
<text class="row" x="118" y="320.0" text-anchor="end">connect-go</text>
<path d="M128,306 h21.6 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-21.6 z" fill="var(--go)"/>
<text class="val" x="132.0" y="339">89,000 spans/s, p99 18.84 ms, connect-zig 8.2×</text>
<text class="row" x="118" y="362.0" text-anchor="end">connect-rust</text>
<path d="M128,348 h70.3 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-70.3 z" fill="var(--rust)"/>
<text class="val" x="132.0" y="381">258,090 spans/s, p99 2.88 ms, connect-zig 2.8×</text>
<text class="panel" x="408" y="154">p99 as the rate climbs</text>
