<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" role="img" aria-labelledby="t d">
<title id="t">The spans a second one core holds, connect-zig against the OpenTelemetry Collector, as one gateway core for 33,000 servers</title>
<desc id="d">One core holds 5.0 times the Collector's spans a second, with p99 under 100 ms. connect-zig held 712,014 spans a second at p99 18.65 ms, and the Collector 142,400 at p99 14.31 ms. p99 at each step: connect-zig: 9k 0.85 ms, 18k 0.85 ms, 27k 0.85 ms, 36k 0.84 ms, 53k 0.83 ms, 71k 0.84 ms, 107k 0.85 ms, 142k 0.93 ms, 214k 1.02 ms, 285k 1.17 ms, 356k 1.36 ms, 427k 1.45 ms, 570k 2.05 ms, 712k 18.65 ms, 854k 149.88 ms refused; OpenTelemetry Collector: 9k 2.04 ms, 18k 1.91 ms, 27k 1.81 ms, 36k 2.07 ms, 53k 2.28 ms, 71k 3.8 ms, 107k 8.17 ms, 142k 14.31 ms, 214k 193.95 ms p99.</desc>
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e4e3df; --zig:#2a78d6; --otel:#b07d00; }
@media (prefers-color-scheme: dark) {
  svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#8f8e86; --grid:#33332f; --zig:#3987e5; --otel:#c99512; }
}
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
.title { font-size: 16px; font-weight: 600; }
.sub { font-size: 12.5px; fill: var(--ink2); }
.panel { font-size: 14px; font-weight: 600; }
.row { font-size: 12.5px; fill: var(--ink2); }
.val { font-size: 11px; font-weight: 600; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.tick { font-size: 11px; fill: var(--muted); }
.legend { font-size: 12.5px; fill: var(--ink2); }
</style>
<rect width="840" height="330" rx="8" fill="var(--surface)"/>
<text class="title" x="24" y="34">One core holds 5.0 times the Collector's spans a second, with p99 under 100 ms</text>
<text class="sub" x="24" y="56">Each server holds 516 TLS connections, as one core of a 64-core gateway for 33,000 servers, and takes</text>
<text class="sub" x="24" y="74">gzip OTLP exports of 16, 128 and 512 spans. The rate climbs until p99 passes 100 ms or a call is refused.</text>
<text class="sub" x="24" y="92">One CI job ran both, and checked every span: run 170, commit 253404b, Neoverse-N2, 4 cores.</text>
<rect x="24" y="102" width="12" height="12" rx="2" fill="var(--zig)"/>
<text class="legend" x="42" y="112">connect-zig</text>
<rect x="143" y="102" width="12" height="12" rx="2" fill="var(--otel)"/>
<text class="legend" x="161" y="112">OpenTelemetry Collector</text>
<text class="panel" x="24" y="154">Spans a second one core holds</text>
<text class="row" x="118" y="201.0" text-anchor="end">connect-zig</text>
<path d="M128,186 h206.0 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-206.0 z" fill="var(--zig)"/>
<text class="val" x="132.0" y="221">712,014 spans/s, p99 18.65 ms</text>
<text class="row" x="118" y="241.0" text-anchor="end">Collector</text>
<path d="M128,226 h38.0 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-38.0 z" fill="var(--otel)"/>
<text class="val" x="132.0" y="261">142,400 spans/s, p99 14.31 ms</text>
<text class="panel" x="408" y="154">p99 as the rate climbs</text>
<line x1="448" y1="278.0" x2="800" y2="278.0" stroke="var(--grid)" stroke-width="1"/>
<text class="tick" x="442" y="282.0" text-anchor="end">1 ms</text>
<line x1="448" y1="244.7" x2="800" y2="244.7" stroke="var(--grid)" stroke-width="1"/>
<text class="tick" x="442" y="248.7" text-anchor="end">10 ms</text>
<line x1="448" y1="211.3" x2="800" y2="211.3" stroke="var(--ink2)" stroke-width="1" stroke-dasharray="4 3"/>
<text class="tick" x="442" y="215.3" text-anchor="end">limit 100 ms</text>
<line x1="448" y1="178.0" x2="800" y2="178.0" stroke="var(--grid)" stroke-width="1"/>
<text class="tick" x="442" y="182.0" text-anchor="end">1,000 ms</text>
<text class="tick" x="448.0" y="304" text-anchor="middle">0k</text>
<text class="tick" x="530.4" y="304" text-anchor="middle">200k</text>
<text class="tick" x="612.8" y="304" text-anchor="middle">400k</text>
<text class="tick" x="695.2" y="304" text-anchor="middle">600k</text>
<text class="tick" x="777.6" y="304" text-anchor="middle">800k</text>
<text class="tick" x="800" y="320" text-anchor="end">spans a second sent</text>
