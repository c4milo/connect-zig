<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" width="840" height="340" role="img" aria-labelledby="t d">
<title id="t">The spans a second one core holds over cleartext h2, connect-zig against Collector, Rotel, as one gateway core for 33,000 servers</title>
<desc id="d">One core holds 3.8 times the Collector's and 2.9 times Rotel's spans a second, with p99 under 100 ms. connect-zig 640,800 spans a second at p99 46.69 ms, Collector 169,116 spans a second at p99 41.42 ms, Rotel 222,488 spans a second at p99 81.33 ms. p99 at each step: connect-zig: 9k 1.16 ms, 18k 1.11 ms, 27k 1.08 ms, 36k 1.08 ms, 53k 1.01 ms, 71k 0.98 ms, 107k 0.96 ms, 142k 1.14 ms, 214k 1.19 ms, 285k 1.39 ms, 356k 1.51 ms, 427k 2.06 ms, 570k 11.26 ms, 641k 46.69 ms, 659k 154.95 ms refused, 676k 160.76 ms refused, 712k 171.94 ms refused; Collector: 9k 2.21 ms, 18k 2.29 ms, 27k 2.48 ms, 36k 2.63 ms, 53k 3.11 ms, 71k 4.92 ms, 107k 10.84 ms, 142k 25.11 ms, 160k 37.47 ms, 169k 41.42 ms, 178k 240.33 ms p99, 214k 2169.07 ms p99; Rotel: 9k 2.11 ms, 18k 4.34 ms, 27k 5.7 ms, 36k 7.28 ms, 53k 40.41 ms, 71k 40.56 ms, 107k 41.1 ms, 142k 41.25 ms, 214k 76.56 ms, 222k 81.33 ms, 231k 1164.38 ms p99, 249k 1638.46 ms p99, 285k 2875.4 ms p99.</desc>
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e4e3df; --zig:#2a78d6; --otel:#b07d00; --vector:#b8407f; --rotel:#722626; }
@media (prefers-color-scheme: dark) {
  svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#8f8e86; --grid:#33332f; --zig:#3987e5; --otel:#c99512; --vector:#d0599a; --rotel:#b84545; }
}
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
.title { font-size: 16px; font-weight: 600; }
.sub { font-size: 12.5px; fill: var(--ink2); }
.panel { font-size: 14px; font-weight: 600; }
.row { font-size: 12.5px; fill: var(--ink2); }
.val { font-size: 11px; font-weight: 600; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.tick { font-size: 11px; fill: var(--muted); }
.legend { font-size: 12.5px; fill: var(--ink2); }
</style>
<rect width="840" height="340" rx="8" fill="var(--surface)"/>
<text class="title" x="24" y="34">One core holds 3.8 times the Collector's and 2.9 times Rotel's spans a second, with p99 under 100 ms</text>
<text class="sub" x="24" y="56">Each server holds 516 connections over cleartext h2, as one core of a 64-core gateway for 33,000 servers, and</text>
<text class="sub" x="24" y="74">takes gzip OTLP exports of 16, 128 and 512 spans. The rate climbs until p99 passes 100 ms or a call is refused.</text>
<text class="sub" x="24" y="92">One CI job ran all, and checked every span: run 177, commit ca4bea6, AMD EPYC 7763 64-Core Processor, 4 cores.</text>
