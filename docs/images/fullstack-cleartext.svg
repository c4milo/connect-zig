<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" width="840" height="340" role="img" aria-labelledby="t d">
<title id="t">The spans a second one core holds over cleartext h2, connect-zig against Collector, Rotel, as one gateway core for 33,000 servers</title>
<desc id="d">One core holds 4.2 times the Collector's and 3.5 times Rotel's spans a second. connect-zig 1,121,464 spans a second at p99 51.96 ms, Collector 264,784 spans a second at p99 19.4 ms, Rotel 322,658 spans a second at p99 76.61 ms. p99 at each step: connect-zig: 9k 0.58 ms, 18k 0.53 ms, 27k 0.52 ms, 36k 0.51 ms, 53k 0.5 ms, 71k 0.52 ms, 107k 0.52 ms, 142k 0.58 ms, 214k 0.57 ms, 285k 0.62 ms, 356k 0.74 ms, 427k 0.83 ms, 570k 1.1 ms, 712k 3.62 ms, 854k 5.45 ms, 997k 10.8 ms, 1,068k 42.54 ms, 1,104k 74.31 ms, 1,121k 51.96 ms, 1,130k 143.93 ms refused, 1,139k 130.65 ms p99; Collector: 9k 1.33 ms, 18k 2.01 ms, 27k 2 ms, 36k 1.64 ms, 53k 1.8 ms, 71k 2.46 ms, 107k 3.11 ms, 142k 6.24 ms, 214k 17.24 ms, 249k 66.15 ms, 258k 47.84 ms, 263k 23.93 ms, 265k 19.4 ms, 267k 134.08 ms p99, 285k 885.24 ms p99; Rotel: 9k 1.13 ms, 18k 2.66 ms, 27k 2.58 ms, 36k 4.21 ms, 53k 40.71 ms, 71k 40.71 ms, 107k 40.88 ms, 142k 40.98 ms, 214k 40.33 ms, 285k 75.94 ms, 320k 40.36 ms, 323k 76.61 ms, 325k 105.22 ms p99, 329k 163.76 ms p99, 338k 393.27 ms p99, 356k 1056.63 ms p99.</desc>
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e4e3df; --zig:#2a78d6; --zigv:#8db8ea; --otel:#b07d00; --vector:#b8407f; --rotel:#722626; --go:#1a8a82; --gov:#8ccfc9; --rust:#b5562b; --rustv:#dfa283; }
@media (prefers-color-scheme: dark) {
  svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#8f8e86; --grid:#33332f; --zig:#3987e5; --zigv:#1f5596; --otel:#c99512; --vector:#d0599a; --rotel:#b84545; --go:#2fa59c; --gov:#1d625d; --rust:#d06d3f; --rustv:#8a4524; }
}
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
.title { font-size: 16px; font-weight: 600; }
.sub { font-size: 12.5px; fill: var(--ink2); }
.panel { font-size: 14px; font-weight: 600; }
.row { font-size: 12.5px; fill: var(--ink2); }
.val { font-size: 11px; font-weight: 600; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.tick { font-size: 11px; fill: var(--muted); }
.legend { font-size: 12.5px; fill: var(--ink2); }
</style>
<rect width="840" height="340" rx="8" fill="var(--surface)"/>
<text class="title" x="24" y="34">One core holds 4.2 times the Collector's and 3.5 times Rotel's spans a second</text>
<text class="sub" x="24" y="56">Each server holds 516 connections over cleartext h2, as one core of a 64-core gateway for 33,000 servers, and</text>
<text class="sub" x="24" y="74">takes gzip OTLP exports of 16, 128 and 512 spans. The rate climbs until p99 passes 100 ms or a call is refused.</text>
<text class="sub" x="24" y="92">A whisker reaches the step that failed, so the rate a core holds lies inside it.</text>
<text class="sub" x="24" y="110">One CI job ran all, and checked every span: run 250, commit a5db7e1, AMD EPYC 9V45 96-Core Processor, 4 cores.</text>
<rect x="24" y="120" width="12" height="12" rx="2" fill="var(--zig)"/>
<text class="legend" x="42" y="130">connect-zig</text>
<rect x="143" y="120" width="12" height="12" rx="2" fill="var(--otel)"/>
<text class="legend" x="161" y="130">OpenTelemetry Collector</text>
