<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 624" width="840" height="624" role="img" aria-labelledby="t d">
<title id="t">What gzip, zstd and brotli leave of each Connect receiver's rate over TLS, as a share of the same receiver uncompressed</title>
<desc id="d">In gzip, zstd and brotli, connect-zig holds 107%, 110% and 92% of its uncompressed rate. connect-zig uncompressed: 689,779 spans a second held, 1,467 calls a second at peak; connect-zig gzip: 741,462 spans a second held, 107% of uncompressed, 1,724 calls a second at peak; connect-zig zstd: 758,710 spans a second held, 110% of uncompressed, 1,758 calls a second at peak; connect-zig brotli: 618,616 spans a second held, 92% of uncompressed, 1,521 calls a second at peak; connect-go uncompressed: 141,850 spans a second held, 370 calls a second at peak; connect-go gzip: 111,221 spans a second held, 76% of uncompressed, 331 calls a second at peak; connect-go zstd: 116,808 spans a second held, 82% of uncompressed, 343 calls a second at peak; connect-go brotli: 111,221 spans a second held, 78% of uncompressed, 332 calls a second at peak; connect-rust uncompressed: 332,458 spans a second held, 1,031 calls a second at peak; connect-rust gzip: 286,058 spans a second held, 86% of uncompressed, 987 calls a second at peak; connect-rust zstd: 301,533 spans a second held, 91% of uncompressed, 928 calls a second at peak; connect-rust brotli: 263,853 spans a second held, 79% of uncompressed, 926 calls a second at peak.</desc>
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e4e3df; --zig:#2a78d6; --go:#1a8a82; --rust:#b5562b; }
@media (prefers-color-scheme: dark) {
  svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#8f8e86; --grid:#33332f; --zig:#3987e5; --go:#2fa59c; --rust:#d06d3f; }
}
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
.title { font-size: 16px; font-weight: 600; }
.sub { font-size: 12.5px; fill: var(--ink2); }
.panel { font-size: 13px; font-weight: 600; }
.server { font-size: 12.5px; font-weight: 600; }
.row { font-size: 12.5px; fill: var(--ink2); }
.val { font-size: 11px; font-weight: 600; fill: var(--ink2); }
.tick { font-size: 11px; fill: var(--muted); }
</style>
<rect width="840" height="624" rx="8" fill="var(--surface)"/>
<text class="title" x="24" y="34">In gzip, zstd and brotli, connect-zig holds 107%, 110% and 92% of its uncompressed rate</text>
<text class="sub" x="24" y="56">Each receiver runs on one core over TLS, on its library's own decoders. stdx's encoders wrote each export as a</text>
<text class="sub" x="24" y="74">connect-zig client does: gzip at stdx's default level, zstd and brotli at level 1. Each bar is a share of the</text>
<text class="sub" x="24" y="92">same receiver uncompressed, net of the TLS and HTTP/2 a smaller export saves. A whisker spans the rounds: in the climb,</text>
<text class="sub" x="24" y="110">each round's share of uncompressed in the same round.</text>
<text class="sub" x="24" y="128">One CI job ran all, and checked every span: run 266, commit 1a541bd, Neoverse-N2, 4 CPUs.</text>
<text class="panel" x="146" y="164">Spans a second held in the climb</text>
<text class="panel" x="516" y="164">Calls a second at peak, 512 spans</text>
