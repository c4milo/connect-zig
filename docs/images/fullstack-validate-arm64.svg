<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 494" width="840" height="494" role="img" aria-labelledby="t d">
<title id="t">The spans a second one core holds over TLS, connect-zig, connect-go and connect-rust, each with and without protovalidate, as one gateway core for 33,000 servers</title>
<desc id="d">Rate kept with protovalidate: connect-zig 86%, connect-go 61%, connect-rust 90%. connect-zig 765,400 spans a second at p99 96.12 ms, connect-zig + protovalidate 658,600 spans a second at p99 85.99 ms, connect-go 96,746 spans a second at p99 68.1 ms, connect-go + protovalidate-go 58,926 spans a second at p99 55.09 ms, connect-rust 269,250 spans a second at p99 18.37 ms, connect-rust + protovalidate-buffa 242,522 spans a second at p99 36.14 ms. p99 at each step: connect-zig: 9k 0.82 ms, 18k 0.79 ms, 27k 0.79 ms, 36k 0.79 ms, 53k 0.78 ms, 71k 0.78 ms, 107k 0.8 ms, 142k 0.9 ms, 214k 0.92 ms, 285k 1.11 ms, 356k 1.31 ms, 427k 1.43 ms, 570k 1.87 ms, 712k 8.1 ms, 748k 53.55 ms, 765k 96.12 ms, 770k 135.55 ms p99, 774k 159.83 ms p99, 783k 181.95 ms refused, 854k 319.24 ms refused; connect-zig + protovalidate: 9k 0.91 ms, 18k 0.89 ms, 27k 0.88 ms, 36k 0.88 ms, 53k 0.88 ms, 71k 0.87 ms, 107k 0.89 ms, 142k 1.03 ms, 214k 1.12 ms, 285k 1.23 ms, 356k 1.5 ms, 427k 1.72 ms, 570k 2.34 ms, 641k 16.88 ms, 659k 85.99 ms, 663k 102.66 ms p99, 668k 113.58 ms p99, 676k 215.14 ms refused, 712k 263.12 ms refused; connect-go: 9k 3.66 ms, 18k 4.96 ms, 27k 4.07 ms, 36k 6.64 ms, 53k 6.55 ms, 71k 10.29 ms, 89k 15.44 ms, 93k 17.14 ms, 96k 60.93 ms, 97k 68.1 ms, 98k 165.72 ms p99, 107k 456.79 ms p99; connect-go + protovalidate-go: 9k 8.54 ms, 18k 10.95 ms, 27k 11.06 ms, 36k 14.19 ms, 53k 17.81 ms, 58k 21.61 ms, 59k 55.09 ms, 60k 127.2 ms p99, 60k 137.09 ms p99, 62k 262.65 ms p99, 71k 2582.21 ms p99; connect-rust: 9k 1.29 ms, 18k 1.27 ms, 27k 1.31 ms, 36k 1.34 ms, 53k 1.34 ms, 71k 1.49 ms, 107k 1.67 ms, 142k 1.83 ms, 214k 2.27 ms, 249k 2.55 ms, 267k 11.45 ms, 269k 18.37 ms, 271k 114.96 ms p99, 276k 115.02 ms p99, 285k 791.22 ms p99; connect-rust + protovalidate-buffa: 9k 1.41 ms, 18k 1.4 ms, 27k 1.39 ms, 36k 1.41 ms, 53k 1.55 ms, 71k 1.68 ms, 107k 1.92 ms, 142k 2.04 ms, 214k 2.73 ms, 231k 3.16 ms, 240k 13.29 ms, 243k 36.14 ms, 245k 117.88 ms p99, 249k 165.46 ms p99, 285k 2063.7 ms p99.</desc>
