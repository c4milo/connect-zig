<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 494" width="840" height="494" role="img" aria-labelledby="t d">
<title id="t">The spans a second one core holds over TLS, connect-zig, connect-go and connect-rust, each with and without protovalidate, as one gateway core for 33,000 servers</title>
<desc id="d">Rate kept with protovalidate: connect-zig 86%, connect-go 61%, connect-rust 95%. connect-zig 760,998 spans a second at p99 92.9 ms, connect-zig + protovalidate 654,086 spans a second at p99 67.87 ms, connect-go 95,668 spans a second at p99 99.65 ms, connect-go + protovalidate-go 58,386 spans a second at p99 80.09 ms, connect-rust 275,894 spans a second at p99 81.73 ms, connect-rust + protovalidate-buffa 262,530 spans a second at p99 99.87 ms. p99 at each step: connect-zig: 9k 0.81 ms, 18k 0.82 ms, 27k 0.8 ms, 36k 0.8 ms, 53k 0.81 ms, 71k 0.8 ms, 107k 0.8 ms, 142k 0.89 ms, 214k 0.94 ms, 285k 1.12 ms, 356k 1.33 ms, 427k 1.4 ms, 570k 1.76 ms, 712k 9.83 ms, 748k 51.13 ms, 756k 61.38 ms, 761k 92.9 ms, 765k 121.96 ms p99, 783k 212.11 ms refused, 854k 219.06 ms refused; connect-zig + protovalidate: 9k 0.92 ms, 18k 0.9 ms, 27k 0.89 ms, 36k 0.89 ms, 53k 0.89 ms, 71k 0.87 ms, 107k 0.89 ms, 142k 1.02 ms, 214k 1.13 ms, 285k 1.24 ms, 356k 1.52 ms, 427k 1.69 ms, 570k 2.27 ms, 641k 36.64 ms, 650k 81.92 ms, 654k 67.87 ms, 659k 110.99 ms p99, 676k 260.58 ms refused, 712k 253.73 ms refused; connect-go: 9k 4.92 ms, 18k 4.03 ms, 27k 4.39 ms, 36k 6.76 ms, 53k 7.18 ms, 71k 11.84 ms, 89k 16.81 ms, 93k 19.27 ms, 96k 99.65 ms, 97k 154.85 ms p99, 98k 231.65 ms p99, 107k 1023.87 ms p99; connect-go + protovalidate-go: 9k 8.15 ms, 18k 10.8 ms, 27k 12.95 ms, 36k 13.15 ms, 53k 20.03 ms, 58k 23.89 ms, 58k 80.09 ms, 59k 102.48 ms p99, 60k 166.06 ms p99, 62k 238.95 ms p99, 71k 2881.69 ms p99; connect-rust: 9k 1.31 ms, 18k 1.33 ms, 27k 1.29 ms, 36k 1.35 ms, 53k 1.38 ms, 71k 1.52 ms, 107k 1.75 ms, 142k 1.87 ms, 214k 2.22 ms, 249k 2.63 ms, 267k 2.99 ms, 276k 81.73 ms, 278k 272.58 ms p99, 280k 411.18 ms p99, 285k 758 ms p99; connect-rust + protovalidate-buffa: 9k 1.41 ms, 18k 1.4 ms, 27k 1.42 ms, 36k 1.45 ms, 53k 1.55 ms, 71k 1.62 ms, 107k 1.91 ms, 142k 2 ms, 214k 2.51 ms, 249k 2.89 ms, 258k 33.84 ms, 263k 99.87 ms, 265k 485.69 ms p99, 267k 346.26 ms p99, 285k 1185.25 ms p99.</desc>
