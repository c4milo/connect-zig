</style>
<rect width="840" height="494" rx="8" fill="var(--surface)"/>
<text class="title" x="24" y="34">Rate kept with protovalidate: connect-zig 86%, connect-go 61%, connect-rust 90%</text>
<text class="sub" x="24" y="56">Each server holds 516 connections over TLS, as one core of a 64-core gateway for 33,000 servers, and</text>
<text class="sub" x="24" y="74">takes gzip OTLP exports of 16, 128 and 512 spans. The rate climbs until p99 passes 100 ms or a call is refused.</text>
<text class="sub" x="24" y="92">Each share is a receiver's spans a second with protovalidate over its own without. A dashed line is a</text>
<text class="sub" x="24" y="110">receiver that validates. A whisker reaches the step that failed, so the rate a core holds lies inside it.</text>
<text class="sub" x="24" y="128">One CI job ran all, and checked every span: run 250, commit a5db7e1, Neoverse-N2, 4 cores.</text>
