<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 624" width="840" height="624" role="img" aria-labelledby="t d">
<title id="t">What gzip, zstd and brotli leave of each Connect receiver's rate over cleartext h2, as a share of the same receiver uncompressed</title>
<desc id="d">In gzip, zstd and brotli, connect-zig holds 101%, 104% and 85% of its uncompressed rate. connect-zig uncompressed: 996,864 spans a second held, 2,210 calls a second at peak; connect-zig gzip: 1,005,700 spans a second held, 101% of uncompressed, 2,264 calls a second at peak; connect-zig zstd: 1,041,300 spans a second held, 104% of uncompressed, 2,371 calls a second at peak; connect-zig brotli: 849,902 spans a second held, 85% of uncompressed, 1,859 calls a second at peak; connect-go uncompressed: 218,056 spans a second held, 503 calls a second at peak; connect-go gzip: 153,532 spans a second held, 70% of uncompressed, 429 calls a second at peak; connect-go zstd: 180,234 spans a second held, 83% of uncompressed, 446 calls a second at peak; connect-go brotli: 162,416 spans a second held, 74% of uncompressed, 429 calls a second at peak; connect-rust uncompressed: 605,200 spans a second held, 1,580 calls a second at peak; connect-rust gzip: 424,926 spans a second held, 70% of uncompressed, 1,355 calls a second at peak; connect-rust zstd: 538,466 spans a second held, 89% of uncompressed, 1,351 calls a second at peak; connect-rust brotli: 453,916 spans a second held, 75% of uncompressed, 1,155 calls a second at peak.</desc>
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e4e3df; --zig:#2a78d6; --go:#1a8a82; --rust:#b5562b; }
@media (prefers-color-scheme: dark) {
  svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#8f8e86; --grid:#33332f; --zig:#3987e5; --go:#2fa59c; --rust:#d06d3f; }
}
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
.title { font-size: 16px; font-weight: 600; }
.sub { font-size: 12.5px; fill: var(--ink2); }
.panel { font-size: 13px; font-weight: 600; }
.server { font-size: 12.5px; font-weight: 600; }
.row { font-size: 12.5px; fill: var(--ink2); }
.val { font-size: 11px; font-weight: 600; fill: var(--ink2); }
.tick { font-size: 11px; fill: var(--muted); }
</style>
<rect width="840" height="624" rx="8" fill="var(--surface)"/>
<text class="title" x="24" y="34">In gzip, zstd and brotli, connect-zig holds 101%, 104% and 85% of its uncompressed rate</text>
<text class="sub" x="24" y="56">Each receiver runs on one core over cleartext h2, on its library's own decoders. stdx's encoders wrote each export as a</text>
<text class="sub" x="24" y="74">connect-zig client does: gzip at stdx's default level, zstd and brotli at level 1. Each bar is a share of the</text>
<text class="sub" x="24" y="92">same receiver uncompressed, net of the HTTP/2 a smaller export saves. A whisker reaches the step that</text>
<text class="sub" x="24" y="110">failed in the climb, and spans the rounds at peak.</text>
<text class="sub" x="24" y="128">One CI job ran all, and checked every span: run 256, commit 57ec581, Intel(R) Xeon(R) 6975P-C, 4 cores.</text>
<text class="panel" x="146" y="164">Spans a second held in the climb</text>
<text class="panel" x="516" y="164">Calls a second at peak, 512 spans</text>
