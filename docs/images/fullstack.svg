<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 416" width="840" height="416" role="img" aria-labelledby="t d">
<title id="t">The spans a second one core holds over TLS, connect-zig against Collector, Vector, connect-go, connect-rust, as one gateway core for 33,000 servers</title>
<desc id="d">One core holds at least 6.1 times connect-go's and at least 2.3 times connect-rust's spans a second. connect-zig 1,139,240 spans a second at p99 29.91 ms, Collector 335,886 spans a second at p99 35.22 ms, Vector 105,646 spans a second at p99 42.56 ms, connect-go 186,900 spans a second at p99 87.21 ms, connect-rust 493,950 spans a second at p99 1.64 ms. p99 at each step: connect-zig: 9k 0.51 ms, 18k 0.48 ms, 27k 0.46 ms, 36k 0.44 ms, 53k 0.57 ms, 71k 0.46 ms, 107k 0.43 ms, 142k 0.49 ms, 214k 0.52 ms, 285k 0.61 ms, 356k 0.67 ms, 427k 0.77 ms, 570k 0.95 ms, 712k 1.19 ms, 854k 1.65 ms, 1,139k 29.91 ms; Collector: 9k 1.35 ms, 18k 1.25 ms, 27k 1.23 ms, 36k 1.01 ms, 53k 1.1 ms, 71k 1.29 ms, 107k 3.68 ms, 142k 5.9 ms, 214k 10.36 ms, 285k 18.14 ms, 320k 30.75 ms, 329k 30.33 ms, 334k 29.87 ms, 336k 35.22 ms, 338k 543.59 ms p99, 356k 130.66 ms p99; Vector: 9k 2.92 ms, 18k 2.54 ms, 27k 3.21 ms, 36k 4.73 ms, 53k 40.65 ms, 71k 41.17 ms, 89k 43.9 ms, 98k 42.95 ms, 102k 42.48 ms, 105k 42.46 ms, 106k 42.56 ms, 107k 328.81 ms p99; connect-go: 9k 1.86 ms, 18k 1.96 ms, 27k 2.29 ms, 36k 2.3 ms, 53k 4.48 ms, 71k 3.86 ms, 107k 4.08 ms, 142k 6.65 ms, 178k 11.32 ms, 187k 87.21 ms, 189k 255.83 ms p99, 191k 158.21 ms p99, 196k 284.17 ms p99, 214k 1875.81 ms p99; connect-rust: 9k 0.85 ms, 18k 0.83 ms, 27k 0.87 ms, 36k 0.96 ms, 53k 1 ms, 71k 0.99 ms, 107k 0.91 ms, 142k 0.99 ms, 214k 1.02 ms, 285k 1.16 ms, 356k 29.04 ms, 427k 1.56 ms, 463k 1.67 ms, 481k 30.89 ms, 490k 1.94 ms, 494k 1.64 ms, 498k 597.13 ms p99, 570k 192.14 ms p99.</desc>
