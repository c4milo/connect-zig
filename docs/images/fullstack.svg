<text class="row" x="118" y="278.0" text-anchor="end">Vector</text>
<path d="M128,264 h16.2 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-16.2 z" fill="var(--vector)"/>
<text class="val" x="132.0" y="297">66,750 spans/s, p99 44.53 ms, connect-zig 10.4×</text>
