<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 434" width="840" height="434" role="img" aria-labelledby="t d">
<title id="t">The spans a second one core holds over TLS, connect-zig against Collector, Vector, connect-go, connect-rust, as one gateway core for 33,000 servers</title>
<desc id="d">One core holds 6.2 times connect-go's and 2.1 times connect-rust's spans a second. connect-zig 990,541 spans a second at p99 61.56 ms, Collector 327,675 spans a second at p99 99.08 ms, Vector 132,786 spans a second at p99 5.62 ms, connect-go 160,510 spans a second at p99 46.02 ms, connect-rust 476,179 spans a second at p99 51.14 ms. p99 at each step: connect-zig: 9k 2.25 ms, 18k 2.18 ms, 27k 2.14 ms, 36k 2.14 ms, 53k 2.28 ms, 71k 2.24 ms, 107k 2.3 ms, 142k 2.35 ms, 214k 2.75 ms, 285k 2.99 ms, 356k 2.79 ms, 427k 2.84 ms, 570k 8.79 ms, 712k 17.32 ms, 854k 38.4 ms, 926k 61.8 ms, 943k 65.64 ms, 952k 124.62 ms p99, 961k 101.08 ms p99, 997k 113.22 ms p99, 1,139k 277.34 ms refused; Collector: 9k 3.08 ms, 18k 2.87 ms, 27k 2.88 ms, 36k 3.04 ms, 53k 3.05 ms, 71k 7.02 ms, 107k 8.73 ms, 142k 9.45 ms, 214k 15.94 ms, 285k 24.33 ms, 303k 31.99 ms, 305k 63.46 ms, 307k 171.89 ms p99, 312k 161.33 ms p99, 320k 112.14 ms p99, 356k 957.8 ms p99; Vector: 9k 4.44 ms, 18k 4.46 ms, 27k 4.64 ms, 36k 4.4 ms, 53k 4.67 ms, 71k 4.71 ms, 80k 10.3 ms, 85k 14.25 ms, 87k 36.59 ms, 88k 157.72 ms p99, 89k 431.88 ms p99, 107k 483.52 ms p99; connect-go: 9k 4.54 ms, 18k 4.53 ms, 27k 3.88 ms, 36k 4.04 ms, 53k 4.97 ms, 71k 4.99 ms, 107k 13.47 ms, 142k 86.71 ms, 160k 15.94 ms, 165k 17.66 ms, 167k 153.95 ms p99, 169k 190.31 ms p99, 178k 535.91 ms p99, 214k 3866.11 ms p99; connect-rust: 9k 2.6 ms, 18k 2.57 ms, 27k 2.78 ms, 36k 2.68 ms, 53k 2.56 ms, 71k 2.79 ms, 107k 3.26 ms, 142k 4.46 ms, 214k 3 ms, 285k 6.56 ms, 356k 55.99 ms, 427k 18.38 ms, 463k 27.46 ms, 472k 70.7 ms, 476k 51.14 ms, 481k 383.88 ms p99, 498k 847.06 ms p99, 570k 3145.93 ms p99.</desc>
