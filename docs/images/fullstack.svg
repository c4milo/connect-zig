<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 398" width="840" height="398" role="img" aria-labelledby="t d">
<title id="t">The spans a second one core holds over TLS, connect-zig against Collector, Vector, connect-go, connect-rust, as one gateway core for 33,000 servers</title>
<desc id="d">One core holds 6.8 times connect-go's and 2.3 times connect-rust's spans a second. connect-zig 605,232 spans a second at p99 83.62 ms, Collector 178,000 spans a second at p99 35.86 ms, Vector 57,850 spans a second at p99 47.39 ms, connect-go 89,000 spans a second at p99 51.39 ms, connect-rust 258,094 spans a second at p99 24.73 ms. p99 at each step: connect-zig: 9k 1.18 ms, 18k 1.15 ms, 27k 1.1 ms, 36k 1.06 ms, 53k 1.02 ms, 71k 1.01 ms, 107k 0.98 ms, 142k 1.1 ms, 214k 1.22 ms, 285k 1.39 ms, 356k 1.81 ms, 427k 1.92 ms, 570k 4.91 ms, 605k 83.62 ms, 623k 152.69 ms refused, 641k 265.13 ms refused, 712k 390.1 ms refused; Collector: 9k 2.38 ms, 18k 2.47 ms, 27k 2.18 ms, 36k 2.29 ms, 53k 2.52 ms, 71k 4.57 ms, 107k 7.87 ms, 142k 18.5 ms, 178k 35.86 ms, 187k 122.43 ms p99, 196k 181.94 ms p99, 214k 738.77 ms p99; Vector: 9k 5.7 ms, 18k 7.35 ms, 27k 8.49 ms, 36k 45.57 ms, 53k 46.56 ms, 58k 47.39 ms, 60k 410.39 ms p99, 62k 878.58 ms p99, 71k 2367.24 ms p99; connect-go: 9k 6.15 ms, 18k 4.48 ms, 27k 5.2 ms, 36k 6.28 ms, 53k 8.21 ms, 71k 11.12 ms, 89k 51.39 ms, 93k 107.13 ms p99, 98k 328.2 ms p99, 107k 1102.79 ms p99; connect-rust: 9k 1.73 ms, 18k 1.7 ms, 27k 1.63 ms, 36k 1.66 ms, 53k 1.66 ms, 71k 1.75 ms, 107k 1.88 ms, 142k 2 ms, 214k 2.65 ms, 249k 3.08 ms, 258k 24.73 ms, 267k 294.13 ms p99, 285k 803.9 ms p99.</desc>
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e4e3df; --zig:#2a78d6; --otel:#b07d00; --vector:#b8407f; --rotel:#722626; --go:#1a8a82; --rust:#b5562b; }
@media (prefers-color-scheme: dark) {
  svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#8f8e86; --grid:#33332f; --zig:#3987e5; --otel:#c99512; --vector:#d0599a; --rotel:#b84545; --go:#2fa59c; --rust:#d06d3f; }
}
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
.title { font-size: 16px; font-weight: 600; }
.sub { font-size: 12.5px; fill: var(--ink2); }
.panel { font-size: 14px; font-weight: 600; }
.row { font-size: 12.5px; fill: var(--ink2); }
.val { font-size: 11px; font-weight: 600; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.tick { font-size: 11px; fill: var(--muted); }
.legend { font-size: 12.5px; fill: var(--ink2); }
</style>
<rect width="840" height="398" rx="8" fill="var(--surface)"/>
<text class="title" x="24" y="34">One core holds 6.8 times connect-go's and 2.3 times connect-rust's spans a second</text>
<text class="sub" x="24" y="56">Each server holds 516 connections over TLS, as one core of a 64-core gateway for 33,000 servers, and</text>
<text class="sub" x="24" y="74">takes gzip OTLP exports of 16, 128 and 512 spans. The rate climbs until p99 passes 100 ms or a call is refused.</text>
<text class="sub" x="24" y="92">One CI job ran all, and checked every span: run 185, commit af0b01e, AMD EPYC 7763 64-Core Processor, 4 cores.</text>
<rect x="24" y="102" width="12" height="12" rx="2" fill="var(--zig)"/>
<text class="legend" x="42" y="112">connect-zig</text>
<rect x="143" y="102" width="12" height="12" rx="2" fill="var(--otel)"/>
<text class="legend" x="161" y="112">OpenTelemetry Collector</text>
