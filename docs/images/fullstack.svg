<text class="val" x="132.0" y="339">124,602 spans/s, p99 14.38 ms, connect-zig 5.6×</text>
<text class="row" x="118" y="362.0" text-anchor="end">connect-rust</text>
<path d="M128,348 h92.9 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-92.9 z" fill="var(--rust)"/>
<text class="val" x="132.0" y="381">320,416 spans/s, p99 9.48 ms, connect-zig 2.2×</text>
<text class="panel" x="408" y="154">p99 as the rate climbs</text>
