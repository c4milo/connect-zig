<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 398" width="840" height="398" role="img" aria-labelledby="t d">
<title id="t">The spans a second one core holds over TLS, connect-zig against Collector, Vector, connect-go, connect-rust, as one gateway core for 33,000 servers</title>
<desc id="d">One core holds 5.6 times connect-go's and 2.2 times connect-rust's spans a second. connect-zig 694,232 spans a second at p99 15.17 ms, Collector 258,094 spans a second at p99 62.93 ms, Vector 66,750 spans a second at p99 44.53 ms, connect-go 124,602 spans a second at p99 14.38 ms, connect-rust 320,416 spans a second at p99 9.48 ms. p99 at each step: connect-zig: 9k 0.83 ms, 18k 0.77 ms, 27k 0.76 ms, 36k 0.75 ms, 53k 0.76 ms, 71k 0.77 ms, 107k 0.79 ms, 142k 0.76 ms, 214k 0.93 ms, 285k 1.08 ms, 356k 1.2 ms, 427k 1.3 ms, 570k 1.49 ms, 641k 2.63 ms, 676k 1.83 ms, 694k 15.17 ms, 712k 2.57 ms refused; Collector: 9k 1.91 ms, 18k 1.83 ms, 27k 1.82 ms, 36k 1.81 ms, 53k 1.88 ms, 71k 2.68 ms, 107k 6.06 ms, 142k 10.53 ms, 214k 24.64 ms, 249k 60.27 ms, 258k 62.93 ms, 267k 155.97 ms p99, 285k 792.79 ms p99; Vector: 9k 4.1 ms, 18k 4.54 ms, 27k 6.23 ms, 36k 40.72 ms, 53k 44.6 ms, 62k 44.48 ms, 67k 44.53 ms, 69k 125.42 ms p99, 71k 104.38 ms p99; connect-go: 9k 2.45 ms, 18k 4.31 ms, 27k 2.8 ms, 36k 3.32 ms, 53k 4.47 ms, 71k 6.69 ms, 107k 10.36 ms, 125k 14.38 ms, 129k 147.55 ms p99, 134k 249.62 ms p99, 142k 480.49 ms p99; connect-rust: 9k 1.5 ms, 18k 1.39 ms, 27k 1.41 ms, 36k 1.52 ms, 53k 1.54 ms, 71k 1.59 ms, 107k 1.6 ms, 142k 1.87 ms, 214k 2.08 ms, 285k 2.48 ms, 320k 9.48 ms, 329k 114.09 ms p99, 338k 725.79 ms p99, 356k 963.17 ms p99.</desc>
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e4e3df; --zig:#2a78d6; --otel:#b07d00; --vector:#b8407f; --rotel:#722626; --go:#1a8a82; --rust:#b5562b; }
@media (prefers-color-scheme: dark) {
  svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#8f8e86; --grid:#33332f; --zig:#3987e5; --otel:#c99512; --vector:#d0599a; --rotel:#b84545; --go:#2fa59c; --rust:#d06d3f; }
}
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
.title { font-size: 16px; font-weight: 600; }
.sub { font-size: 12.5px; fill: var(--ink2); }
.panel { font-size: 14px; font-weight: 600; }
.row { font-size: 12.5px; fill: var(--ink2); }
.val { font-size: 11px; font-weight: 600; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.tick { font-size: 11px; fill: var(--muted); }
.legend { font-size: 12.5px; fill: var(--ink2); }
</style>
<rect width="840" height="398" rx="8" fill="var(--surface)"/>
<text class="title" x="24" y="34">One core holds 5.6 times connect-go's and 2.2 times connect-rust's spans a second</text>
<text class="sub" x="24" y="56">Each server holds 516 connections over TLS, as one core of a 64-core gateway for 33,000 servers, and</text>
<text class="sub" x="24" y="74">takes gzip OTLP exports of 16, 128 and 512 spans. The rate climbs until p99 passes 100 ms or a call is refused.</text>
<text class="sub" x="24" y="92">One CI job ran all, and checked every span: run 191, commit fa83b86, AMD EPYC 9V74 80-Core Processor, 4 cores.</text>
<rect x="24" y="102" width="12" height="12" rx="2" fill="var(--zig)"/>
<text class="legend" x="42" y="112">connect-zig</text>
<rect x="143" y="102" width="12" height="12" rx="2" fill="var(--otel)"/>
<text class="legend" x="161" y="112">OpenTelemetry Collector</text>
