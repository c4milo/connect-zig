<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 398" width="840" height="398" role="img" aria-labelledby="t d">
<title id="t">The spans a second one core holds over TLS, connect-zig against Collector, Vector, connect-go, connect-rust, as one gateway core for 33,000 servers</title>
<desc id="d">One core holds 5.0 times connect-go's and 1.9 times connect-rust's spans a second. connect-zig 622,968 spans a second at p99 1.72 ms, Collector 249,200 spans a second at p99 55.37 ms, Vector 75,666 spans a second at p99 44.51 ms, connect-go 124,600 spans a second at p99 14.48 ms, connect-rust 329,300 spans a second at p99 78.33 ms. p99 at each step: connect-zig: 9k 0.81 ms, 18k 0.78 ms, 27k 0.75 ms, 36k 0.75 ms, 53k 0.74 ms, 71k 0.75 ms, 107k 0.79 ms, 142k 0.77 ms, 214k 0.92 ms, 285k 1.01 ms, 356k 1.18 ms, 427k 1.3 ms, 570k 1.53 ms, 605k 1.77 ms, 623k 1.72 ms, 641k 2.06 ms refused, 712k 4.26 ms refused; Collector: 9k 1.94 ms, 18k 1.86 ms, 27k 1.94 ms, 36k 1.53 ms, 53k 1.88 ms, 71k 2.69 ms, 107k 7.16 ms, 142k 10.06 ms, 214k 25.97 ms, 249k 55.37 ms, 258k 313.02 ms p99, 267k 260.22 ms p99, 285k 760.39 ms p99; Vector: 9k 4.98 ms, 18k 5.88 ms, 27k 7.55 ms, 36k 44.01 ms, 53k 45.26 ms, 71k 45.45 ms, 76k 44.51 ms, 80k 1324.73 ms p99, 89k 2478.54 ms p99, 107k 3712.55 ms p99; connect-go: 9k 4.12 ms, 18k 3.43 ms, 27k 3.05 ms, 36k 4.13 ms, 53k 4.82 ms, 71k 7.06 ms, 107k 9.11 ms, 125k 14.48 ms, 129k 159.9 ms p99, 134k 189.65 ms p99, 142k 371.09 ms p99; connect-rust: 9k 1.49 ms, 18k 1.33 ms, 27k 1.32 ms, 36k 1.33 ms, 53k 1.38 ms, 71k 1.49 ms, 107k 1.51 ms, 142k 1.61 ms, 214k 2.04 ms, 285k 2.54 ms, 320k 15.23 ms, 329k 78.33 ms, 338k 382.69 ms p99, 356k 803.43 ms p99.</desc>
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e4e3df; --zig:#2a78d6; --otel:#b07d00; --vector:#b8407f; --rotel:#722626; --go:#1a8a82; --rust:#b5562b; }
@media (prefers-color-scheme: dark) {
  svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#8f8e86; --grid:#33332f; --zig:#3987e5; --otel:#c99512; --vector:#d0599a; --rotel:#b84545; --go:#2fa59c; --rust:#d06d3f; }
}
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
.title { font-size: 16px; font-weight: 600; }
.sub { font-size: 12.5px; fill: var(--ink2); }
.panel { font-size: 14px; font-weight: 600; }
.row { font-size: 12.5px; fill: var(--ink2); }
.val { font-size: 11px; font-weight: 600; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.tick { font-size: 11px; fill: var(--muted); }
.legend { font-size: 12.5px; fill: var(--ink2); }
</style>
<rect width="840" height="398" rx="8" fill="var(--surface)"/>
<text class="title" x="24" y="34">One core holds 5.0 times connect-go's and 1.9 times connect-rust's spans a second</text>
<text class="sub" x="24" y="56">Each server holds 516 connections over TLS, as one core of a 64-core gateway for 33,000 servers, and</text>
<text class="sub" x="24" y="74">takes gzip OTLP exports of 16, 128 and 512 spans. The rate climbs until p99 passes 100 ms or a call is refused.</text>
<text class="sub" x="24" y="92">One CI job ran all, and checked every span: run 182, commit 15e6986, AMD EPYC 9V74 80-Core Processor, 4 cores.</text>
<rect x="24" y="102" width="12" height="12" rx="2" fill="var(--zig)"/>
<text class="legend" x="42" y="112">connect-zig</text>
<rect x="143" y="102" width="12" height="12" rx="2" fill="var(--otel)"/>
<text class="legend" x="161" y="112">OpenTelemetry Collector</text>
