<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 416" width="840" height="416" role="img" aria-labelledby="t d">
<title id="t">The spans a second one core holds over TLS, connect-zig against Collector, Vector, connect-go, connect-rust, as one gateway core for 33,000 servers</title>
<desc id="d">One core holds 6.8 times connect-go's and 2.1 times connect-rust's spans a second. connect-zig 1,103,536 spans a second at p99 90.87 ms, Collector 320,416 spans a second at p99 84.25 ms, Vector 87,860 spans a second at p99 43.99 ms, connect-go 162,416 spans a second at p99 58.31 ms, connect-rust 520,650 spans a second at p99 26.26 ms. p99 at each step: connect-zig: 9k 0.64 ms, 18k 0.55 ms, 27k 0.55 ms, 36k 0.57 ms, 53k 0.59 ms, 71k 0.52 ms, 107k 0.57 ms, 142k 0.56 ms, 214k 0.62 ms, 285k 0.69 ms, 356k 0.76 ms, 427k 0.88 ms, 570k 2.39 ms, 712k 3.31 ms, 854k 1.89 ms, 997k 39.49 ms, 1,068k 95.06 ms, 1,104k 90.87 ms, 1,112k 102.49 ms p99, 1,121k 299.38 ms refused, 1,139k 445.82 ms refused; Collector: 9k 1.63 ms, 18k 1.49 ms, 27k 1.48 ms, 36k 1.42 ms, 53k 2.03 ms, 71k 3.82 ms, 107k 5.38 ms, 142k 9.26 ms, 214k 14.42 ms, 285k 39.93 ms, 320k 84.25 ms, 323k 228.28 ms p99, 325k 437.52 ms p99, 329k 671.45 ms p99, 338k 980.26 ms p99, 356k 1240.17 ms p99; Vector: 9k 3.75 ms, 18k 4.47 ms, 27k 4.88 ms, 36k 9.88 ms, 53k 44.49 ms, 71k 44.17 ms, 80k 44.66 ms, 85k 44.46 ms, 87k 45.79 ms, 88k 43.99 ms, 89k 642.93 ms p99, 107k 2544.02 ms p99; connect-go: 9k 2.63 ms, 18k 2.49 ms, 27k 2.57 ms, 36k 3.42 ms, 53k 2.98 ms, 71k 8.83 ms, 107k 7.72 ms, 142k 16.59 ms, 160k 56.02 ms, 162k 58.31 ms, 165k 153.67 ms p99, 169k 1567.5 ms p99, 178k 1783.55 ms p99, 214k 3446.31 ms p99; connect-rust: 9k 1.06 ms, 18k 0.96 ms, 27k 0.96 ms, 36k 1 ms, 53k 1.02 ms, 71k 1.06 ms, 107k 0.98 ms, 142k 1 ms, 214k 1.08 ms, 285k 5.87 ms, 356k 1.86 ms, 427k 1.62 ms, 498k 58.81 ms, 516k 27.44 ms, 521k 26.26 ms, 525k 279.13 ms p99, 534k 419.71 ms p99, 570k 860.24 ms p99.</desc>
