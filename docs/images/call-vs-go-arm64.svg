<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 272" width="840" height="272" role="img" aria-labelledby="t d">
<title id="t">A routed unary call through connect-zig and connect-rust, against connect-go</title>
<desc id="d">connect-zig is 15.3 to 23.4 times as fast as connect-go, 3.5 to 6.4 times connect-rust. Each bar is an implementation's speed in multiples of connect-go v1.18.1's, which is connect-go's time a call over the implementation's, for a small and a medium message in Connect and gRPC. connect-zig: Connect: Small, 40 B 22.5x, Medium, 1 KB 15.3x; gRPC: Small, 40 B 23.4x, Medium, 1 KB 15.6x. connect-rust 0.9.1: Connect: Small, 40 B 3.9x, Medium, 1 KB 4.4x; gRPC: Small, 40 B 3.7x, Medium, 1 KB 4.3x.</desc>
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e4e3df; --zig:#2a78d6; --rust:#eb6834; --unit:#52514e; }
@media (prefers-color-scheme: dark) {
  svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#8f8e86; --grid:#33332f; --zig:#3987e5; --rust:#d95926; --unit:#c3c2b7; }
}
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
.title { font-size: 17px; font-weight: 600; }
.sub { font-size: 12.5px; fill: var(--ink2); }
.panel { font-size: 14px; font-weight: 600; }
.row { font-size: 12.5px; fill: var(--ink2); }
.val { font-size: 11px; font-weight: 600; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.tick { font-size: 11px; fill: var(--muted); }
.note { font-size: 11.5px; fill: var(--ink2); }
.legend { font-size: 12.5px; fill: var(--ink2); }
</style>
<rect width="840" height="272" rx="8" fill="var(--surface)"/>
<text class="title" x="24" y="34">connect-zig is 15.3 to 23.4 times as fast as connect-go, 3.5 to 6.4 times connect-rust</text>
<text class="sub" x="24" y="56">One unary call in memory: router, route, protocol and codec, with no socket, no TLS and no HTTP/2 framing.</text>
<text class="sub" x="24" y="74">Each bar is a speed in multiples of connect-go's: its time over the bar's time. A longer bar is faster.</text>
<text class="sub" x="24" y="92">One CI job ran all three, and each answered the same octets: run 250, commit a5db7e1, aarch64, Neoverse-N2.</text>
<rect x="24" y="100" width="12" height="12" rx="2" fill="var(--zig)"/>
<text class="legend" x="42" y="110">connect-zig</text>
<rect x="143" y="100" width="12" height="12" rx="2" fill="var(--rust)"/>
<text class="legend" x="161" y="110">connect-rust 0.9.1</text>
<line x1="311" y1="106" x2="327" y2="106" stroke="var(--unit)" stroke-width="1.5" stroke-dasharray="4 3"/>
<text class="legend" x="333" y="110">connect-go v1.18.1: the unit</text>
<text class="panel" x="24" y="148">Connect</text>
<line x1="136.0" y1="160" x2="136.0" y2="234" stroke="var(--grid)" stroke-width="1"/>
<text class="tick" x="136.0" y="248" text-anchor="middle">0×</text>
<line x1="173.5" y1="160" x2="173.5" y2="234" stroke="var(--grid)" stroke-width="1"/>
<text class="tick" x="173.5" y="248" text-anchor="middle">5×</text>
<line x1="211.0" y1="160" x2="211.0" y2="234" stroke="var(--grid)" stroke-width="1"/>
<text class="tick" x="211.0" y="248" text-anchor="middle">10×</text>
<line x1="248.5" y1="160" x2="248.5" y2="234" stroke="var(--grid)" stroke-width="1"/>
<text class="tick" x="248.5" y="248" text-anchor="middle">15×</text>
<line x1="286.0" y1="160" x2="286.0" y2="234" stroke="var(--grid)" stroke-width="1"/>
<text class="tick" x="286.0" y="248" text-anchor="middle">20×</text>
<text class="row" x="126" y="182.0" text-anchor="end">Small, 40 B</text>
<path d="M136.0,164 h164.5 a4.0,4.0 0 0 1 4.0,4.0 v5.0 a4.0,4.0 0 0 1 -4.0,4.0 h-164.5 z" fill="var(--zig)"/>
<text class="val" x="309.5" y="174">22.5×, 0.33 µs</text>
<path d="M136.0,179 h25.5 a4.0,4.0 0 0 1 4.0,4.0 v5.0 a4.0,4.0 0 0 1 -4.0,4.0 h-25.5 z" fill="var(--rust)"/>
<text class="val" x="170.5" y="189">3.9×</text>
<text class="row" x="126" y="220.0" text-anchor="end">Medium, 1 KB</text>
<path d="M136.0,202 h110.7 a4.0,4.0 0 0 1 4.0,4.0 v5.0 a4.0,4.0 0 0 1 -4.0,4.0 h-110.7 z" fill="var(--zig)"/>
<text class="val" x="255.7" y="212">15.3×, 1.74 µs</text>
<path d="M136.0,217 h29.1 a4.0,4.0 0 0 1 4.0,4.0 v5.0 a4.0,4.0 0 0 1 -4.0,4.0 h-29.1 z" fill="var(--rust)"/>
<text class="val" x="174.1" y="227">4.4×</text>
<line x1="143.5" y1="156" x2="143.5" y2="234" stroke="var(--unit)" stroke-width="1.5" stroke-dasharray="4 3"/>
<text class="note" x="147.5" y="154">1× = as fast as connect-go</text>
<text class="panel" x="432" y="148">gRPC</text>
<line x1="544.0" y1="160" x2="544.0" y2="234" stroke="var(--grid)" stroke-width="1"/>
<text class="tick" x="544.0" y="248" text-anchor="middle">0×</text>
<line x1="581.5" y1="160" x2="581.5" y2="234" stroke="var(--grid)" stroke-width="1"/>
<text class="tick" x="581.5" y="248" text-anchor="middle">5×</text>
<line x1="619.0" y1="160" x2="619.0" y2="234" stroke="var(--grid)" stroke-width="1"/>
<text class="tick" x="619.0" y="248" text-anchor="middle">10×</text>
<line x1="656.5" y1="160" x2="656.5" y2="234" stroke="var(--grid)" stroke-width="1"/>
<text class="tick" x="656.5" y="248" text-anchor="middle">15×</text>
<line x1="694.0" y1="160" x2="694.0" y2="234" stroke="var(--grid)" stroke-width="1"/>
<text class="tick" x="694.0" y="248" text-anchor="middle">20×</text>
<text class="row" x="534" y="182.0" text-anchor="end">Small, 40 B</text>
<path d="M544.0,164 h171.8 a4.0,4.0 0 0 1 4.0,4.0 v5.0 a4.0,4.0 0 0 1 -4.0,4.0 h-171.8 z" fill="var(--zig)"/>
<text class="val" x="724.8" y="174">23.4×, 0.35 µs</text>
<path d="M544.0,179 h23.5 a4.0,4.0 0 0 1 4.0,4.0 v5.0 a4.0,4.0 0 0 1 -4.0,4.0 h-23.5 z" fill="var(--rust)"/>
<text class="val" x="576.5" y="189">3.7×</text>
<text class="row" x="534" y="220.0" text-anchor="end">Medium, 1 KB</text>
<path d="M544.0,202 h113.0 a4.0,4.0 0 0 1 4.0,4.0 v5.0 a4.0,4.0 0 0 1 -4.0,4.0 h-113.0 z" fill="var(--zig)"/>
<text class="val" x="666.0" y="212">15.6×, 1.75 µs</text>
<path d="M544.0,217 h28.2 a4.0,4.0 0 0 1 4.0,4.0 v5.0 a4.0,4.0 0 0 1 -4.0,4.0 h-28.2 z" fill="var(--rust)"/>
<text class="val" x="581.2" y="227">4.3×</text>
<line x1="551.5" y1="156" x2="551.5" y2="234" stroke="var(--unit)" stroke-width="1.5" stroke-dasharray="4 3"/>
</svg>
