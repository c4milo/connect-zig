<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 272" width="840" height="272" role="img" aria-labelledby="t d">
<title id="t">A routed unary call through connect-zig and connect-rust, against connect-go</title>
<desc id="d">connect-zig is 14.9 to 22.9 times as fast as connect-go, 3.4 to 6.5 times connect-rust. Each bar is an implementation's speed in multiples of connect-go v1.18.1's, which is connect-go's time a call over the implementation's, for a small and a medium message in Connect and gRPC. connect-zig: Connect: Small, 40 B 21.1x, Medium, 1 KB 14.9x; gRPC: Small, 40 B 22.9x, Medium, 1 KB 15.5x. connect-rust 0.9.1: Connect: Small, 40 B 3.8x, Medium, 1 KB 4.4x; gRPC: Small, 40 B 3.5x, Medium, 1 KB 4.3x.</desc>
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e4e3df; --zig:#2a78d6; --rust:#eb6834; --unit:#52514e; }
@media (prefers-color-scheme: dark) {
  svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#8f8e86; --grid:#33332f; --zig:#3987e5; --rust:#d95926; --unit:#c3c2b7; }
}
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
.title { font-size: 17px; font-weight: 600; }
.sub { font-size: 12.5px; fill: var(--ink2); }
.panel { font-size: 14px; font-weight: 600; }
.row { font-size: 12.5px; fill: var(--ink2); }
.val { font-size: 11px; font-weight: 600; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.tick { font-size: 11px; fill: var(--muted); }
.note { font-size: 11.5px; fill: var(--ink2); }
.legend { font-size: 12.5px; fill: var(--ink2); }
</style>
<rect width="840" height="272" rx="8" fill="var(--surface)"/>
<text class="title" x="24" y="34">connect-zig is 14.9 to 22.9 times as fast as connect-go, 3.4 to 6.5 times connect-rust</text>
<text class="sub" x="24" y="56">One unary call in memory: router, route, protocol and codec, with no socket, no TLS and no HTTP/2 framing.</text>
<text class="sub" x="24" y="74">Each bar is a speed in multiples of connect-go's: its time over the bar's time. A longer bar is faster.</text>
<text class="sub" x="24" y="92">One CI job ran all three, and each answered the same octets: run 256, commit 57ec581, aarch64, Neoverse-N2.</text>
<rect x="24" y="100" width="12" height="12" rx="2" fill="var(--zig)"/>
<text class="legend" x="42" y="110">connect-zig</text>
<rect x="143" y="100" width="12" height="12" rx="2" fill="var(--rust)"/>
<text class="legend" x="161" y="110">connect-rust 0.9.1</text>
<line x1="311" y1="106" x2="327" y2="106" stroke="var(--unit)" stroke-width="1.5" stroke-dasharray="4 3"/>
<text class="legend" x="333" y="110">connect-go v1.18.1: the unit</text>
<text class="panel" x="24" y="148">Connect</text>
<line x1="136.0" y1="160" x2="136.0" y2="234" stroke="var(--grid)" stroke-width="1"/>
<text class="tick" x="136.0" y="248" text-anchor="middle">0×</text>
<line x1="175.1" y1="160" x2="175.1" y2="234" stroke="var(--grid)" stroke-width="1"/>
<text class="tick" x="175.1" y="248" text-anchor="middle">5×</text>
<line x1="214.3" y1="160" x2="214.3" y2="234" stroke="var(--grid)" stroke-width="1"/>
<text class="tick" x="214.3" y="248" text-anchor="middle">10×</text>
<line x1="253.4" y1="160" x2="253.4" y2="234" stroke="var(--grid)" stroke-width="1"/>
<text class="tick" x="253.4" y="248" text-anchor="middle">15×</text>
<line x1="292.5" y1="160" x2="292.5" y2="234" stroke="var(--grid)" stroke-width="1"/>
<text class="tick" x="292.5" y="248" text-anchor="middle">20×</text>
<text class="row" x="126" y="182.0" text-anchor="end">Small, 40 B</text>
<path d="M136.0,164 h161.5 a4.0,4.0 0 0 1 4.0,4.0 v5.0 a4.0,4.0 0 0 1 -4.0,4.0 h-161.5 z" fill="var(--zig)"/>
<text class="val" x="306.5" y="174">21.1×, 0.34 µs</text>
<path d="M136.0,179 h25.7 a4.0,4.0 0 0 1 4.0,4.0 v5.0 a4.0,4.0 0 0 1 -4.0,4.0 h-25.7 z" fill="var(--rust)"/>
<text class="val" x="170.7" y="189">3.8×</text>
<text class="row" x="126" y="220.0" text-anchor="end">Medium, 1 KB</text>
<path d="M136.0,202 h112.7 a4.0,4.0 0 0 1 4.0,4.0 v5.0 a4.0,4.0 0 0 1 -4.0,4.0 h-112.7 z" fill="var(--zig)"/>
<text class="val" x="257.7" y="212">14.9×, 1.76 µs</text>
<path d="M136.0,217 h30.2 a4.0,4.0 0 0 1 4.0,4.0 v5.0 a4.0,4.0 0 0 1 -4.0,4.0 h-30.2 z" fill="var(--rust)"/>
<text class="val" x="175.2" y="227">4.4×</text>
<line x1="143.8" y1="156" x2="143.8" y2="234" stroke="var(--unit)" stroke-width="1.5" stroke-dasharray="4 3"/>
<text class="note" x="147.8" y="154">1× = as fast as connect-go</text>
<text class="panel" x="432" y="148">gRPC</text>
<line x1="544.0" y1="160" x2="544.0" y2="234" stroke="var(--grid)" stroke-width="1"/>
<text class="tick" x="544.0" y="248" text-anchor="middle">0×</text>
<line x1="583.1" y1="160" x2="583.1" y2="234" stroke="var(--grid)" stroke-width="1"/>
<text class="tick" x="583.1" y="248" text-anchor="middle">5×</text>
<line x1="622.3" y1="160" x2="622.3" y2="234" stroke="var(--grid)" stroke-width="1"/>
<text class="tick" x="622.3" y="248" text-anchor="middle">10×</text>
<line x1="661.4" y1="160" x2="661.4" y2="234" stroke="var(--grid)" stroke-width="1"/>
<text class="tick" x="661.4" y="248" text-anchor="middle">15×</text>
<line x1="700.5" y1="160" x2="700.5" y2="234" stroke="var(--grid)" stroke-width="1"/>
<text class="tick" x="700.5" y="248" text-anchor="middle">20×</text>
<text class="row" x="534" y="182.0" text-anchor="end">Small, 40 B</text>
<path d="M544.0,164 h174.8 a4.0,4.0 0 0 1 4.0,4.0 v5.0 a4.0,4.0 0 0 1 -4.0,4.0 h-174.8 z" fill="var(--zig)"/>
<text class="val" x="727.8" y="174">22.9×, 0.35 µs</text>
<path d="M544.0,179 h23.7 a4.0,4.0 0 0 1 4.0,4.0 v5.0 a4.0,4.0 0 0 1 -4.0,4.0 h-23.7 z" fill="var(--rust)"/>
<text class="val" x="576.7" y="189">3.5×</text>
<text class="row" x="534" y="220.0" text-anchor="end">Medium, 1 KB</text>
<path d="M544.0,202 h117.3 a4.0,4.0 0 0 1 4.0,4.0 v5.0 a4.0,4.0 0 0 1 -4.0,4.0 h-117.3 z" fill="var(--zig)"/>
<text class="val" x="670.3" y="212">15.5×, 1.75 µs</text>
<path d="M544.0,217 h29.4 a4.0,4.0 0 0 1 4.0,4.0 v5.0 a4.0,4.0 0 0 1 -4.0,4.0 h-29.4 z" fill="var(--rust)"/>
<text class="val" x="582.4" y="227">4.3×</text>
<line x1="551.8" y1="156" x2="551.8" y2="234" stroke="var(--unit)" stroke-width="1.5" stroke-dasharray="4 3"/>
</svg>
