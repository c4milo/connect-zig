<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 642" width="840" height="642" role="img" aria-labelledby="t d">
<title id="t">What gzip, zstd and brotli leave of each Connect receiver's rate over cleartext h2, as a share of the same receiver uncompressed</title>
<desc id="d">In gzip, zstd and brotli, connect-zig holds 102%, 104% and 88% of its uncompressed rate. connect-zig uncompressed: 801,036 spans a second held, 1,735 calls a second at peak; connect-zig gzip: 814,308 spans a second held, 102% of uncompressed, 1,775 calls a second at peak; connect-zig zstd: 832,022 spans a second held, 104% of uncompressed, 1,815 calls a second at peak; connect-zig brotli: 707,550 spans a second held, 88% of uncompressed, 1,547 calls a second at peak; connect-go uncompressed: 153,504 spans a second held, 374 calls a second at peak; connect-go gzip: 111,250 spans a second held, 72% of uncompressed, 333 calls a second at peak; connect-go zstd: 123,460 spans a second held, 80% of uncompressed, 343 calls a second at peak; connect-go brotli: 117,916 spans a second held, 77% of uncompressed, 328 calls a second at peak; connect-rust uncompressed: 371,558 spans a second held, 1,112 calls a second at peak; connect-rust gzip: 318,168 spans a second held, 86% of uncompressed, 1,004 calls a second at peak; connect-rust zstd: 347,094 spans a second held, 93% of uncompressed, 1,025 calls a second at peak; connect-rust brotli: 302,600 spans a second held, 81% of uncompressed, 954 calls a second at peak.</desc>
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e4e3df; --zig:#2a78d6; --go:#1a8a82; --rust:#b5562b; }
@media (prefers-color-scheme: dark) {
  svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#8f8e86; --grid:#33332f; --zig:#3987e5; --go:#2fa59c; --rust:#d06d3f; }
}
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
.title { font-size: 16px; font-weight: 600; }
.sub { font-size: 12.5px; fill: var(--ink2); }
.panel { font-size: 13px; font-weight: 600; }
.server { font-size: 12.5px; font-weight: 600; }
.row { font-size: 12.5px; fill: var(--ink2); }
.val { font-size: 11px; font-weight: 600; fill: var(--ink2); }
.tick { font-size: 11px; fill: var(--muted); }
</style>
<rect width="840" height="642" rx="8" fill="var(--surface)"/>
<text class="title" x="24" y="34">In gzip, zstd and brotli, connect-zig holds 102%, 104% and 88% of its uncompressed rate</text>
<text class="sub" x="24" y="56">Each receiver runs on one core over cleartext h2, on its library's own decoders. stdx's encoders wrote each export as a</text>
<text class="sub" x="24" y="74">connect-zig client does: gzip at stdx's default level, zstd and brotli at level 1. Each bar is a share of the</text>
<text class="sub" x="24" y="92">same receiver uncompressed, net of the HTTP/2 a smaller export saves. A whisker reaches the step that</text>
<text class="sub" x="24" y="110">failed in the climb, and spans the rounds at peak; ≥ marks a climb whose every step passed, and "slots full"</text>
<text class="sub" x="24" y="128">one that ended on a call refused because every slot for a call in flight was taken.</text>
<text class="sub" x="24" y="146">One CI job ran all, and checked every span: run 250, commit a5db7e1, Neoverse-N2, 4 cores.</text>
<text class="panel" x="146" y="182">Spans a second held in the climb</text>
<text class="panel" x="516" y="182">Calls a second at peak, 512 spans</text>
