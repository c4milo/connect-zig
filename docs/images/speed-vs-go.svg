<text class="tick" x="168.6" y="260" text-anchor="middle">1×</text>
<line x1="201.1" y1="118" x2="201.1" y2="246" stroke="var(--grid)" stroke-width="1"/>
<text class="tick" x="201.1" y="260" text-anchor="middle">2×</text>
<line x1="233.7" y1="118" x2="233.7" y2="246" stroke="var(--grid)" stroke-width="1"/>
<text class="tick" x="233.7" y="260" text-anchor="middle">3×</text>
<line x1="266.3" y1="118" x2="266.3" y2="246" stroke="var(--grid)" stroke-width="1"/>
<text class="tick" x="266.3" y="260" text-anchor="middle">4×</text>
<line x1="298.9" y1="118" x2="298.9" y2="246" stroke="var(--grid)" stroke-width="1"/>
<text class="tick" x="298.9" y="260" text-anchor="middle">5×</text>
<line x1="331.4" y1="118" x2="331.4" y2="246" stroke="var(--grid)" stroke-width="1"/>
<text class="tick" x="331.4" y="260" text-anchor="middle">6×</text>
<line x1="364.0" y1="118" x2="364.0" y2="246" stroke="var(--grid)" stroke-width="1"/>
<text class="tick" x="364.0" y="260" text-anchor="middle">7×</text>
<text class="row" x="126" y="135" text-anchor="end">Small, 40 B</text>
