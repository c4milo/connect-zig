<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" width="840" height="560" role="img" aria-labelledby="t d">
<title id="t">connect-zig and Buffa, connect-rust's codec, against Go's protobuf runtime, connect-go's codec</title>
<desc id="d">connect-zig is 3.7 to 19.9 times faster than Go and 1.0 to 2.4 times faster than Buffa. Each bar is a runtime's speed in multiples of Go's, which is the time of Go's google.golang.org/protobuf v1.36.12, connect-go's codec, over the runtime's time, for four messages and four operations. connect-zig: Small, 40 B: Binary encode 10.7x, Binary decode, every field read 5.0x, JSON encode 11.3x, JSON decode 12.2x; Medium, 1 KB: Binary encode 13.0x, Binary decode, every field read 9.8x, JSON encode 9.0x, JSON decode 18.3x; Large, 180 KB: Binary encode 3.7x, Binary decode, every field read 4.5x, JSON encode 8.0x, JSON decode 14.5x; Deep, 50 levels: Binary encode 4.3x, Binary decode, every field read 5.0x, JSON encode 19.9x, JSON decode 16.2x. Buffa 0.9.2, connect-rust's codec: Small, 40 B: Binary encode 5.5x, Binary decode, every field read 3.5x, JSON encode 10.4x, JSON decode 10.2x; Medium, 1 KB: Binary encode 8.7x, Binary decode, every field read 6.0x, JSON encode 8.9x, JSON decode 8.8x; Large, 180 KB: Binary encode 2.6x, Binary decode, every field read 2.8x, JSON encode 5.5x, JSON decode 9.1x; Deep, 50 levels: Binary encode 3.8x, Binary decode, every field read 2.5x, JSON encode 18.0x, JSON decode 6.8x.</desc>
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e4e3df; --zig:#2a78d6; --rust:#eb6834; --unit:#52514e; }
@media (prefers-color-scheme: dark) {
  svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#8f8e86; --grid:#33332f; --zig:#3987e5; --rust:#d95926; --unit:#c3c2b7; }
}
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
.title { font-size: 17px; font-weight: 600; }
.sub { font-size: 12.5px; fill: var(--ink2); }
.panel { font-size: 14px; font-weight: 600; }
.row { font-size: 12.5px; fill: var(--ink2); }
.val { font-size: 11px; font-weight: 600; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.tick { font-size: 11px; fill: var(--muted); }
.note { font-size: 11.5px; fill: var(--ink2); }
.legend { font-size: 12.5px; fill: var(--ink2); }
</style>
<rect width="840" height="560" rx="8" fill="var(--surface)"/>
<text class="title" x="24" y="34">connect-zig is 3.7 to 19.9 times faster than Go and 1.0 to 2.4 times faster than Buffa</text>
<text class="sub" x="24" y="56">Each bar is a runtime's speed in multiples of Go's: Go's time over the runtime's time. A longer bar is faster.</text>
<text class="sub" x="24" y="74">One CI job ran all three, and each wrote the same octets: run 256, commit 57ec581, x86_64, AMD EPYC 7763 64-Core Processor.</text>
