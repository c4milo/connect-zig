<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" width="840" height="560" role="img" aria-labelledby="t d">
<title id="t">connect-zig and Buffa against Go's protobuf runtime</title>
<desc id="d">connect-zig is 3.5 to 14.9 times faster than Go; Buffa beats it in 2 of 16 cells. Each bar is a runtime's speed in multiples of Go's, which is the time of Go, google.golang.org/protobuf v1.36.12, over the runtime's time, for four messages and four operations. connect-zig: Small, 40 B: Binary encode 8.5x, Binary decode, every field read 6.5x, JSON encode 8.7x, JSON decode 10.7x; Medium, 1 KB: Binary encode 10.7x, Binary decode, every field read 9.0x, JSON encode 8.4x, JSON decode 14.9x; Large, 180 KB: Binary encode 3.5x, Binary decode, every field read 4.2x, JSON encode 7.3x, JSON decode 12.8x; Deep, 50 levels: Binary encode 3.5x, Binary decode, every field read 4.5x, JSON encode 13.5x, JSON decode 12.5x. Rust, Buffa 0.9.2: Small, 40 B: Binary encode 5.1x, Binary decode, every field read 3.3x, JSON encode 9.7x, JSON decode 9.7x; Medium, 1 KB: Binary encode 7.1x, Binary decode, every field read 5.8x, JSON encode 7.7x, JSON decode 8.9x; Large, 180 KB: Binary encode 2.5x, Binary decode, every field read 2.5x, JSON encode 4.9x, JSON decode 8.5x; Deep, 50 levels: Binary encode 3.2x, Binary decode, every field read 2.6x, JSON encode 16.1x, JSON decode 6.6x.</desc>
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e4e3df; --zig:#2a78d6; --rust:#eb6834; --unit:#52514e; }
@media (prefers-color-scheme: dark) {
