<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" width="840" height="560" role="img" aria-labelledby="t d">
<title id="t">connect-zig and Buffa against Go's protobuf runtime</title>
<desc id="d">connect-zig is 2.4 to 13.1 times faster than Go; Buffa beats it in 4 of 16 cells. Each bar is a runtime's speed in multiples of Go's, which is the time of Go, google.golang.org/protobuf v1.36.12, over the runtime's time, for four messages and four operations. connect-zig: Small, 40 B: Binary encode 6.7x, Binary decode, every field read 5.5x, JSON encode 7.0x, JSON decode 10.2x; Medium, 1 KB: Binary encode 7.2x, Binary decode, every field read 5.9x, JSON encode 8.3x, JSON decode 13.1x; Large, 180 KB: Binary encode 2.4x, Binary decode, every field read 2.6x, JSON encode 7.2x, JSON decode 10.7x; Deep, 50 levels: Binary encode 3.9x, Binary decode, every field read 3.2x, JSON encode 10.6x, JSON decode 9.9x. Rust, Buffa 0.9.2: Small, 40 B: Binary encode 5.7x, Binary decode, every field read 2.6x, JSON encode 8.1x, JSON decode 8.4x; Medium, 1 KB: Binary encode 7.6x, Binary decode, every field read 5.0x, JSON encode 7.0x, JSON decode 8.5x; Large, 180 KB: Binary encode 2.9x, Binary decode, every field read 2.0x, JSON encode 4.4x, JSON decode 8.7x; Deep, 50 levels: Binary encode 3.8x, Binary decode, every field read 2.4x, JSON encode 12.7x, JSON decode 6.4x.</desc>
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e4e3df; --zig:#2a78d6; --rust:#eb6834; --unit:#52514e; }
@media (prefers-color-scheme: dark) {
