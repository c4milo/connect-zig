<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" width="840" height="560" role="img" aria-labelledby="t d">
<title id="t">connect-zig against Go's and Rust's protobuf runtimes</title>
<desc id="d">connect-zig is 2.2 to 13.5 times faster than Go; Buffa beats it in 6 of 16 cells. Each value is a baseline's time over connect-zig's, for four messages and four operations; above 1 means connect-zig is faster. Go, google.golang.org/protobuf v1.36.12: Small, 40 B: Binary encode 7.2x, Binary decode, every field read 6.5x, JSON encode 7.9x, JSON decode 10.4x; Medium, 1 KB: Binary encode 6.0x, Binary decode, every field read 4.5x, JSON encode 9.9x, JSON decode 13.5x; Large, 180 KB: Binary encode 2.3x, Binary decode, every field read 2.2x, JSON encode 7.2x, JSON decode 10.8x; Deep, 50 levels: Binary encode 3.4x, Binary decode, every field read 2.7x, JSON encode 11.9x, JSON decode 10.7x. Rust, Buffa 0.9.2: Small, 40 B: Binary encode 1.4x, Binary decode, every field read 1.9x, JSON encode 0.8x, JSON decode 1.1x; Medium, 1 KB: Binary encode 0.9x, Binary decode, every field read 0.8x, JSON encode 1.2x, JSON decode 1.6x; Large, 180 KB: Binary encode 0.9x, Binary decode, every field read 0.9x, JSON encode 1.5x, JSON decode 1.3x; Deep, 50 levels: Binary encode 1.1x, Binary decode, every field read 1.0x, JSON encode 0.8x, JSON decode 1.6x.</desc>
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e4e3df; --go:#2a78d6; --rust:#eb6834; --parity:#52514e; }
@media (prefers-color-scheme: dark) {
  svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#8f8e86; --grid:#33332f; --go:#3987e5; --rust:#d95926; --parity:#c3c2b7; }
}
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
.title { font-size: 17px; font-weight: 600; }
.sub { font-size: 12.5px; fill: var(--ink2); }
.panel { font-size: 14px; font-weight: 600; }
.row { font-size: 12.5px; fill: var(--ink2); }
.val { font-size: 11px; font-weight: 600; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.tick { font-size: 11px; fill: var(--muted); }
.note { font-size: 11.5px; fill: var(--ink2); }
.legend { font-size: 12.5px; fill: var(--ink2); }
</style>
