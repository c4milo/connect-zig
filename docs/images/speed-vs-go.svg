<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" width="840" height="560" role="img" aria-labelledby="t d">
<title id="t">connect-zig against Go's and Rust's protobuf runtimes</title>
<desc id="d">connect-zig is 2.1 to 13.2 times faster than Go; Buffa beats it in 7 of 16 cells. Each value is a baseline's time over connect-zig's, for four messages and four operations; above 1 means connect-zig is faster. Go, google.golang.org/protobuf v1.36.12: Small, 40 B: Binary encode 2.5x, Binary decode, every field read 5.4x, JSON encode 6.9x, JSON decode 10.3x; Medium, 1 KB: Binary encode 5.6x, Binary decode, every field read 4.1x, JSON encode 8.0x, JSON decode 13.2x; Large, 180 KB: Binary encode 2.1x, Binary decode, every field read 2.1x, JSON encode 7.3x, JSON decode 10.4x; Deep, 50 levels: Binary encode 3.5x, Binary decode, every field read 2.7x, JSON encode 10.3x, JSON decode 9.9x. Rust, Buffa 0.9.2: Small, 40 B: Binary encode 0.4x, Binary decode, every field read 2.0x, JSON encode 0.8x, JSON decode 1.2x; Medium, 1 KB: Binary encode 0.6x, Binary decode, every field read 0.8x, JSON encode 1.2x, JSON decode 1.6x; Large, 180 KB: Binary encode 0.7x, Binary decode, every field read 1.0x, JSON encode 1.7x, JSON decode 1.2x; Deep, 50 levels: Binary encode 0.9x, Binary decode, every field read 1.1x, JSON encode 0.8x, JSON decode 1.6x.</desc>
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e4e3df; --go:#2a78d6; --rust:#eb6834; --parity:#52514e; }
@media (prefers-color-scheme: dark) {
  svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#8f8e86; --grid:#33332f; --go:#3987e5; --rust:#d95926; --parity:#c3c2b7; }
}
