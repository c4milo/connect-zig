<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" width="840" height="560" role="img" aria-labelledby="t d">
<title id="t">connect-zig and Buffa against Go's protobuf runtime</title>
<desc id="d">connect-zig is 3.7 to 14.8 times faster than Go and 1.0 to 2.1 times faster than Buffa. Each bar is a runtime's speed in multiples of Go's, which is the time of Go, google.golang.org/protobuf v1.36.12, over the runtime's time, for four messages and four operations. connect-zig: Small, 40 B: Binary encode 8.9x, Binary decode, every field read 6.5x, JSON encode 9.9x, JSON decode 8.9x; Medium, 1 KB: Binary encode 14.8x, Binary decode, every field read 9.2x, JSON encode 9.5x, JSON decode 12.7x; Large, 180 KB: Binary encode 4.0x, Binary decode, every field read 3.7x, JSON encode 8.3x, JSON decode 9.9x; Deep, 50 levels: Binary encode 4.6x, Binary decode, every field read 3.8x, JSON encode 14.5x, JSON decode 9.3x. Rust, Buffa 0.9.2: Small, 40 B: Binary encode 8.4x, Binary decode, every field read 3.1x, JSON encode 9.2x, JSON decode 8.6x; Medium, 1 KB: Binary encode 10.3x, Binary decode, every field read 6.7x, JSON encode 7.5x, JSON decode 8.2x; Large, 180 KB: Binary encode 3.0x, Binary decode, every field read 2.9x, JSON encode 4.9x, JSON decode 8.6x; Deep, 50 levels: Binary encode 3.4x, Binary decode, every field read 2.7x, JSON encode 13.1x, JSON decode 6.1x.</desc>
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e4e3df; --zig:#2a78d6; --rust:#eb6834; --unit:#52514e; }
@media (prefers-color-scheme: dark) {
  svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#8f8e86; --grid:#33332f; --zig:#3987e5; --rust:#d95926; --unit:#c3c2b7; }
}
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
.title { font-size: 17px; font-weight: 600; }
.sub { font-size: 12.5px; fill: var(--ink2); }
.panel { font-size: 14px; font-weight: 600; }
.row { font-size: 12.5px; fill: var(--ink2); }
.val { font-size: 11px; font-weight: 600; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.tick { font-size: 11px; fill: var(--muted); }
.note { font-size: 11.5px; fill: var(--ink2); }
.legend { font-size: 12.5px; fill: var(--ink2); }
</style>
<rect width="840" height="560" rx="8" fill="var(--surface)"/>
<text class="title" x="24" y="34">connect-zig is 3.7 to 14.8 times faster than Go and 1.0 to 2.1 times faster than Buffa</text>
<text class="sub" x="24" y="56">Each bar is a runtime's speed in multiples of Go's: Go's time over the runtime's time. A longer bar is faster.</text>
<text class="sub" x="24" y="74">One CI job ran all three, and each wrote the same octets: run 116, commit c3ad49d, x86_64, INTEL(R) XEON(R) PLATINUM 8573C.</text>
