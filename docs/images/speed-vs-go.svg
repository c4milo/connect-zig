<text class="title" x="24" y="34">connect-zig is 2.2 to 13.5 times faster than Go; Buffa beats it in 6 of 16 cells</text>
<text class="sub" x="24" y="56">Each bar is a runtime's speed in multiples of Go's: Go's time over the runtime's time. A longer bar is faster.</text>
<text class="sub" x="24" y="74">The three programs ran in one CI job and wrote the same octets: run 97, commit 52fc27a.</text>
