<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" width="840" height="560" role="img" aria-labelledby="t d">
<title id="t">connect-zig and Buffa against Go's protobuf runtime</title>
<desc id="d">connect-zig is 3.9 to 14.9 times faster than Go; Buffa beats it in no cell. Each bar is a runtime's speed in multiples of Go's, which is the time of Go, google.golang.org/protobuf v1.36.12, over the runtime's time, for four messages and four operations. connect-zig: Small, 40 B: Binary encode 7.9x, Binary decode, every field read 6.4x, JSON encode 9.4x, JSON decode 9.7x; Medium, 1 KB: Binary encode 13.2x, Binary decode, every field read 9.0x, JSON encode 8.9x, JSON decode 14.2x; Large, 180 KB: Binary encode 4.1x, Binary decode, every field read 4.9x, JSON encode 7.8x, JSON decode 11.2x; Deep, 50 levels: Binary encode 3.9x, Binary decode, every field read 4.2x, JSON encode 14.9x, JSON decode 11.5x. Rust, Buffa 0.9.2: Small, 40 B: Binary encode 6.6x, Binary decode, every field read 2.9x, JSON encode 9.4x, JSON decode 8.0x; Medium, 1 KB: Binary encode 9.5x, Binary decode, every field read 6.6x, JSON encode 7.4x, JSON decode 8.1x; Large, 180 KB: Binary encode 3.2x, Binary decode, every field read 3.3x, JSON encode 5.2x, JSON decode 8.3x; Deep, 50 levels: Binary encode 2.8x, Binary decode, every field read 2.6x, JSON encode 14.4x, JSON decode 5.9x.</desc>
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e4e3df; --zig:#2a78d6; --rust:#eb6834; --unit:#52514e; }
@media (prefers-color-scheme: dark) {
  svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#8f8e86; --grid:#33332f; --zig:#3987e5; --rust:#d95926; --unit:#c3c2b7; }
}
