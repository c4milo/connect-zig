<text class="title" x="24" y="34">connect-zig is 2.4 to 13.1 times faster than Go; Buffa beats it in 4 of 16 cells</text>
<text class="sub" x="24" y="56">Each bar is a runtime's speed in multiples of Go's: Go's time over the runtime's time. A longer bar is faster.</text>
<text class="sub" x="24" y="74">The three programs ran in one CI job and wrote the same octets: run 105, commit 1fac7e6.</text>
