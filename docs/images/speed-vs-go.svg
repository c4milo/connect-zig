<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" width="840" height="560" role="img" aria-labelledby="t d">
<title id="t">connect-zig and Buffa, connect-rust's codec, against Go's protobuf runtime, connect-go's codec</title>
<desc id="d">connect-zig is 3.3 to 19.0 times faster than Go; Buffa beats it in 1 of 16 cells. Each bar is a runtime's speed in multiples of Go's, which is the time of Go's google.golang.org/protobuf v1.36.12, connect-go's codec, over the runtime's time, for four messages and four operations. connect-zig: Small, 40 B: Binary encode 8.9x, Binary decode, every field read 5.8x, JSON encode 9.1x, JSON decode 13.9x; Medium, 1 KB: Binary encode 6.6x, Binary decode, every field read 9.1x, JSON encode 8.5x, JSON decode 19.0x; Large, 180 KB: Binary encode 3.3x, Binary decode, every field read 4.4x, JSON encode 8.3x, JSON decode 15.8x; Deep, 50 levels: Binary encode 4.4x, Binary decode, every field read 4.6x, JSON encode 17.4x, JSON decode 11.3x. Buffa 0.9.2, connect-rust's codec: Small, 40 B: Binary encode 6.3x, Binary decode, every field read 2.7x, JSON encode 8.2x, JSON decode 9.7x; Medium, 1 KB: Binary encode 9.6x, Binary decode, every field read 5.6x, JSON encode 7.0x, JSON decode 9.5x; Large, 180 KB: Binary encode 2.9x, Binary decode, every field read 1.9x, JSON encode 4.6x, JSON decode 9.6x; Deep, 50 levels: Binary encode 4.3x, Binary decode, every field read 2.3x, JSON encode 13.1x, JSON decode 7.4x.</desc>
<style>
