<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" width="840" height="560" role="img" aria-labelledby="t d">
<title id="t">connect-zig and Buffa, connect-rust's codec, against Go's protobuf runtime, connect-go's codec</title>
<desc id="d">connect-zig is 2.8 to 21.5 times faster than Go; Buffa beats it in 2 of 16 cells. Each bar is a runtime's speed in multiples of Go's, which is the time of Go's google.golang.org/protobuf v1.36.12, connect-go's codec, over the runtime's time, for four messages and four operations. connect-zig: Small, 40 B: Binary encode 7.6x, Binary decode, every field read 6.6x, JSON encode 13.0x, JSON decode 11.5x; Medium, 1 KB: Binary encode 10.3x, Binary decode, every field read 5.5x, JSON encode 9.3x, JSON decode 14.5x; Large, 180 KB: Binary encode 4.2x, Binary decode, every field read 3.5x, JSON encode 8.9x, JSON decode 11.8x; Deep, 50 levels: Binary encode 2.8x, Binary decode, every field read 4.4x, JSON encode 21.5x, JSON decode 11.6x. Buffa 0.9.2, connect-rust's codec: Small, 40 B: Binary encode 7.4x, Binary decode, every field read 3.0x, JSON encode 10.7x, JSON decode 8.1x; Medium, 1 KB: Binary encode 9.7x, Binary decode, every field read 6.9x, JSON encode 8.0x, JSON decode 7.9x; Large, 180 KB: Binary encode 3.3x, Binary decode, every field read 3.3x, JSON encode 5.2x, JSON decode 7.9x; Deep, 50 levels: Binary encode 2.9x, Binary decode, every field read 2.7x, JSON encode 17.9x, JSON decode 5.7x.</desc>
<style>
