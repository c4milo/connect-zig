<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" width="840" height="560" role="img" aria-labelledby="t d">
<title id="t">connect-zig and Buffa, connect-rust's codec, against Go's protobuf runtime, connect-go's codec</title>
<desc id="d">connect-zig is 3.3 to 17.9 times faster than Go; Buffa beats it in 1 of 16 cells. Each bar is a runtime's speed in multiples of Go's, which is the time of Go's google.golang.org/protobuf v1.36.12, connect-go's codec, over the runtime's time, for four messages and four operations. connect-zig: Small, 40 B: Binary encode 8.7x, Binary decode, every field read 5.8x, JSON encode 9.8x, JSON decode 13.2x; Medium, 1 KB: Binary encode 10.8x, Binary decode, every field read 9.6x, JSON encode 9.4x, JSON decode 17.9x; Large, 180 KB: Binary encode 3.3x, Binary decode, every field read 4.2x, JSON encode 7.6x, JSON decode 10.2x; Deep, 50 levels: Binary encode 3.6x, Binary decode, every field read 4.7x, JSON encode 17.1x, JSON decode 15.4x. Buffa 0.9.2, connect-rust's codec: Small, 40 B: Binary encode 4.9x, Binary decode, every field read 3.0x, JSON encode 10.2x, JSON decode 10.1x; Medium, 1 KB: Binary encode 7.4x, Binary decode, every field read 5.7x, JSON encode 8.1x, JSON decode 8.7x; Large, 180 KB: Binary encode 2.4x, Binary decode, every field read 2.4x, JSON encode 5.1x, JSON decode 8.2x; Deep, 50 levels: Binary encode 3.4x, Binary decode, every field read 2.8x, JSON encode 16.3x, JSON decode 6.7x.</desc>
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e4e3df; --zig:#2a78d6; --rust:#eb6834; --unit:#52514e; }
@media (prefers-color-scheme: dark) {
