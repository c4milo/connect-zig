<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" width="840" height="560" role="img" aria-labelledby="t d">
<title id="t">connect-zig and Buffa against Go's protobuf runtime</title>
<desc id="d">connect-zig is 2.2 to 13.7 times faster than Go; Buffa beats it in 3 of 16 cells. Each bar is a runtime's speed in multiples of Go's, which is the time of Go, google.golang.org/protobuf v1.36.12, over the runtime's time, for four messages and four operations. connect-zig: Small, 40 B: Binary encode 9.2x, Binary decode, every field read 6.6x, JSON encode 8.2x, JSON decode 10.4x; Medium, 1 KB: Binary encode 8.0x, Binary decode, every field read 8.4x, JSON encode 9.3x, JSON decode 13.7x; Large, 180 KB: Binary encode 2.2x, Binary decode, every field read 2.8x, JSON encode 7.2x, JSON decode 10.9x; Deep, 50 levels: Binary encode 3.6x, Binary decode, every field read 3.6x, JSON encode 13.1x, JSON decode 10.8x. Rust, Buffa 0.9.2: Small, 40 B: Binary encode 5.1x, Binary decode, every field read 3.2x, JSON encode 9.5x, JSON decode 9.6x; Medium, 1 KB: Binary encode 6.9x, Binary decode, every field read 5.8x, JSON encode 7.7x, JSON decode 8.8x; Large, 180 KB: Binary encode 2.5x, Binary decode, every field read 2.4x, JSON encode 5.0x, JSON decode 8.4x; Deep, 50 levels: Binary encode 3.2x, Binary decode, every field read 2.6x, JSON encode 15.6x, JSON decode 6.5x.</desc>
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e4e3df; --zig:#2a78d6; --rust:#eb6834; --unit:#52514e; }
@media (prefers-color-scheme: dark) {
  svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#8f8e86; --grid:#33332f; --zig:#3987e5; --rust:#d95926; --unit:#c3c2b7; }
}
