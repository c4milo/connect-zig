<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" width="840" height="500" role="img" aria-labelledby="t d">
<title id="t">connect-zig against Go's protobuf runtime</title>
<desc id="d">How many times faster connect-zig is than google.golang.org/protobuf v1.36.12, Go's time over connect-zig's, for four messages and four operations. Every value is above 1: Small, 40 B: Binary encode 3.3x, Binary decode, every field read 6.5x, JSON encode 3.2x, JSON decode 5.0x; Medium, 1 KB: Binary encode 5.8x, Binary decode, every field read 4.8x, JSON encode 4.4x, JSON decode 6.4x; Large, 180 KB: Binary encode 2.2x, Binary decode, every field read 2.4x, JSON encode 2.6x, JSON decode 5.3x; Deep, 50 levels: Binary encode 2.4x, Binary decode, every field read 3.0x, JSON encode 4.4x, JSON decode 4.4x.</desc>
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e4e3df; --bar:#2a78d6; --parity:#52514e; }
@media (prefers-color-scheme: dark) {
  svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#8f8e86; --grid:#33332f; --bar:#3987e5; --parity:#c3c2b7; }
}
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
.title { font-size: 20px; font-weight: 600; }
.sub { font-size: 13px; fill: var(--ink2); }
.panel { font-size: 14px; font-weight: 600; }
.row { font-size: 12.5px; fill: var(--ink2); }
.val { font-size: 12.5px; font-weight: 600; }
.tick { font-size: 11px; fill: var(--muted); }
.note { font-size: 11.5px; fill: var(--ink2); }
</style>
<rect width="840" height="500" rx="8" fill="var(--surface)"/>
<text class="title" x="24" y="36">connect-zig is 2.2 to 6.5 times faster than Go's protobuf runtime</text>
<text class="sub" x="24" y="58">Go's time over connect-zig's (higher is faster), against google.golang.org/protobuf v1.36.12, the runtime connect-go uses.</text>
<text class="sub" x="24" y="76">Both ran in one CI job and wrote the same octets: run 48, commit 7a1d092.</text>
<text class="panel" x="24" y="106">Binary encode</text>
