<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 320" width="840" height="320" role="img" aria-labelledby="t d">
<title id="t">The time of a routed call as its route table grows, for connect-zig, connect-rust and connect-go</title>
<desc id="d">1 to 256 routes, a call's time at most: connect-zig +7%, connect-rust -3%, connect-go +1%. Each line is one implementation's time a call over its time with one route. Connect, connect-zig: 1 routes 240.5 ns, 16 routes 240.6 ns, 256 routes 258.5 ns; Connect, connect-rust: 1 routes 1341.6 ns, 16 routes 1308.3 ns, 256 routes 1288.7 ns; Connect, connect-go: 1 routes 5717.0 ns, 16 routes 5673.0 ns, 256 routes 5596.8 ns; gRPC, connect-zig: 1 routes 266.0 ns, 16 routes 269.5 ns, 256 routes 284.8 ns; gRPC, connect-rust: 1 routes 1588.3 ns, 16 routes 1559.7 ns, 256 routes 1533.9 ns; gRPC, connect-go: 1 routes 6242.0 ns, 16 routes 6209.1 ns, 256 routes 6283.3 ns.</desc>
<style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e4e3df; --zig:#2a78d6; --rust:#eb6834; --go:#6f6e69; }
@media (prefers-color-scheme: dark) {
  svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#8f8e86; --grid:#33332f; --zig:#3987e5; --rust:#d95926; --go:#a8a79f; }
}
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
.title { font-size: 16px; font-weight: 600; }
.sub { font-size: 12.5px; fill: var(--ink2); }
.panel { font-size: 14px; font-weight: 600; }
.val { font-size: 11px; font-weight: 600; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.tick { font-size: 11px; fill: var(--muted); }
.legend { font-size: 12.5px; fill: var(--ink2); }
</style>
<rect width="840" height="320" rx="8" fill="var(--surface)"/>
<text class="title" x="24" y="34">1 to 256 routes, a call's time at most: connect-zig +7%, connect-rust -3%, connect-go +1%</text>
<text class="sub" x="24" y="56">The small message's routed call in memory, its route among more methods and services. Each line is one</text>
<text class="sub" x="24" y="74">implementation's time a call over its own time with one route: a flat line costs the same at any size.</text>
<text class="sub" x="24" y="92">One CI job ran all three: run 170, commit 253404b, x86_64, Intel(R) Xeon(R) 6975P-C.</text>
