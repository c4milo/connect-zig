<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 456" width="840" height="456" role="img" aria-labelledby="t d">
<title id="t">The spans a second one core holds over TLS, connect-zig against Collector, Vector, connect-go, connect-rust, as one gateway core for 33,000 servers</title>
<desc id="d">One core holds 6.7 times connect-go's and 2.5 times connect-rust's spans a second. connect-zig 743,128 spans a second at p99 82.46 ms, Collector 231,400 spans a second at p99 62.18 ms, Vector 84,373 spans a second at p99 18.12 ms, connect-go 111,738 spans a second at p99 45.3 ms, connect-rust 294,222 spans a second at p99 14.11 ms. p99 at each step: connect-zig: 9k 2.25 ms, 18k 2.31 ms, 27k 2.33 ms, 36k 2.25 ms, 53k 2.34 ms, 71k 2.35 ms, 107k 2.51 ms, 142k 2.69 ms, 214k 2.72 ms, 285k 3.05 ms, 356k 3.09 ms, 427k 3.33 ms, 570k 3.75 ms, 712k 8.89 ms, 730k 80.48 ms, 739k 84.05 ms, 743k 82.46 ms, 748k 109.41 ms p99, 783k 279.45 ms refused, 854k 396.35 ms refused; Collector: 9k 3.4 ms, 18k 3.34 ms, 27k 3.38 ms, 36k 3.48 ms, 53k 3.78 ms, 71k 5.09 ms, 107k 9.36 ms, 142k 15.03 ms, 214k 35.33 ms, 231k 62.18 ms, 234k 107.88 ms p99, 236k 139.73 ms p99, 240k 145.75 ms p99, 249k 169.97 ms p99, 285k 3156.05 ms p99; Vector: 9k 5.78 ms, 18k 6.17 ms, 27k 6.29 ms, 36k 6.5 ms, 53k 7.03 ms, 71k 7.42 ms, 80k 7.93 ms, 82k 19.34 ms, 83k 2115.77 ms p99, 85k 1810.73 ms p99, 89k 2241.6 ms p99, 107k 4298.01 ms p99; connect-go: 9k 4.79 ms, 18k 4.74 ms, 27k 5.73 ms, 36k 5.96 ms, 53k 7.01 ms, 71k 9.81 ms, 107k 18.74 ms, 109k 25.46 ms, 110k 319 ms p99, 111k 222.44 ms p99, 116k 916.11 ms p99, 125k 2048.05 ms p99, 142k 4462.35 ms p99; connect-rust: 9k 2.84 ms, 18k 2.8 ms, 27k 2.83 ms, 36k 2.88 ms, 53k 2.87 ms, 71k 2.87 ms, 107k 3.03 ms, 142k 3.26 ms, 214k 3.52 ms, 285k 3.79 ms, 287k 25.95 ms, 289k 118.86 ms p99, 294k 615.79 ms p99, 303k 1234.6 ms p99, 320k 2148.9 ms p99, 356k 3430.96 ms p99.</desc>
<style>
